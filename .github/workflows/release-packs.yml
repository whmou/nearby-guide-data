name: Release Packs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate source YAML
        run: python tools/validate.py --all

      - name: Build packs
        run: python tools/build_packs.py --all --output dist

      - name: Run tests
        run: python -m pytest -v

      - name: Check reproducibility
        run: python tools/check_generated.py

      - name: Inspect packs
        run: |
          for f in dist/packs/*.guidepack; do
            python tools/inspect_pack.py "$f"
          done

      - name: Check release does not exist (refuse to overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "ERROR: Release already exists; choose a new version/tag."
            exit 1
          fi

      - name: Create GitHub Release and upload packs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --latest=false \
            --title "NearbyGuide Packs $RELEASE_TAG" \
            --notes "Automated pack release. See catalog.json for pack metadata." \
            $PRERELEASE_FLAG \
            dist/packs/*.guidepack

      - name: Verify public assets and publish index only after assets exist
        if: ${{ !inputs.prerelease }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python tools/update_catalog.py --dist dist --release-tag "$RELEASE_TAG"
          python tools/verify_release.py --catalog catalog.json
          python tools/export_viewer_data.py
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add catalog.json public/viewer_data.json
          git diff --staged --quiet || git commit -m "chore: publish verified catalog for $RELEASE_TAG"
          git push origin HEAD:main
