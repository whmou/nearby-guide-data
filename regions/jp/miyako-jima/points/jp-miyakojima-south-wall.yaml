  title: "サウスウォール（ダイビングスポット）"
  summary: "「サウスウォール」尚未確認為宮古島的具名潛點；保留查核提醒，不提供海上座標或下潛敘事。"
  narration: |-
    看潛水行程時，先看清楚潛點名稱，常常比照片裡的藍色更重要。「サウスウォール」這個名字，目前還沒有足夠資料能確認它指的是宮古島哪一處海底地形；原先關於四十公尺礁壁、魚群與能見度的描寫，因此不能當成這裡的實況。宮古島當地業者的潛點表，確實分別列有ウォールケーブ與ロウニンドロップオフ，也為不同洞窟、斷崖標出程度需求，但相似的英文詞不是同一個地點的證明。若你的預約單真的寫著這個名稱，請業者把日文全名、所屬海域及集合地點說明清楚；海底景物的位置與登船櫃檯，本來就可能相距很遠。在身分釐清前，這段只做查核提醒，不帶你沿海找入口，也不把另一個潛點的故事搬過來。
  observationPrompt: "核對業者現場行程板或預約單上的完整潛點名；若與本筆不同，請勿按相似名稱自行尋找海岸入口。"
