  title: "Pinza-Abu遺跡（參訪未確認）"
  summary: "認識宮古島史前人骨與動物化石的發現地；尚無可確認的公共抵達點，停用導航。"
  narration: "一小塊骨頭，怎麼把一座島的故事帶回文字出現以前？Pinza-Abu遺跡在一九八〇年由長谷川善和教授等人發掘，研究者找到人骨，也找到鼠類、鹿類和蛇類等動物化石，讓宮古島的早期人類與動物歷史有了可以研究的材料。吸引人的不只是「很古老」，而是這些不同生命都在島上留下線索，我們才能慢慢追問，過去的環境和今天有哪些不同。這段故事先留作旅行背景：目前取得的官方資料能證明遺跡身分，卻沒有確認現在可公開抵達的洞外觀看處，也沒有證明現場設有解說牌，因此不提供導航或安排入洞。讀資料時，可以留意作者如何區分人骨與動物化石；認識考古，不一定要親自站到洞口。"
  observationPrompt: "閱讀官方遺跡資料時，找找人骨與動物化石各自提供了哪些研究線索；請勿自行尋路接近洞口。"
