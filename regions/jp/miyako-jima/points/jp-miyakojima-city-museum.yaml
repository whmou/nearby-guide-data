  locationHint: "宮古島市総合博物館建築圖釘，地址平良字東仲宗根添1166-287；並非實測正門。2026年9月23日為秋分國定假日，按常規休館；出發前查臨時公告及展室開放範圍，勿以有定位等同當天可入館。"
  summary: "從仿仲宗根豊見親墓的石灰岩建築認識宮古生活史。2026年9月23日依國定假日規則休館，展室開放範圍也須先查公告。"
  narration: |
    還沒走進展室，先看看博物館的門面：這座建築使用琉球石灰岩，設計取意於仲宗根豊見親墓。也就是說，收藏歷史的房子，本身先借用了島上歷史的形狀。與其急著找最珍貴的文物，不妨先比較石面的紋理、門面的比例，想想一座墓的建築語彙，怎麼變成迎接大家認識家鄉的入口。市方介紹館藏時，除了歷史與民俗，也提到重現昔日生活的模型；值得問的不是古人有多奇特，而是他們怎麼把日子過下去。不過，這趟要先看日曆：九月二十三日是秋分國定假日，依館方規則休館。七月復館公告也曾說明，颱風影響下暫只開放第二展示室。出發前再查最新公告；如果尚未開放，就把觀察留在允許停留的外部，不把任何一件展品當成保證能看的行程。
  observationPrompt: "在允許停留的外部比較石灰岩門面的紋理與造型；入館前先核對當日休館及展室開放公告。"
