  title: "宮古島海中公園"
  summary: "狩俣的海中觀察設施，以24扇壓克力窗觀看自然海域；官方路線終點是陸上接待區，輪椅升降機故障公告須出發前確認。"
  narration: |
    先留意管理棟像龜殼的輪廓，這座建築把入口設計成了認識海洋的第一個提示。宮古島海中公園的主角則在階梯下方：大約海面下四公尺的觀察空間，透過二十四扇壓克力窗，讓人穿著平常的衣服看向真正的海。這裡不是把魚養進水槽，再排好一場表演；官方特別提醒，海況和天氣會改變每天的畫面，魚群出現的種類也不固定。不妨先在一扇窗前看一會兒，分辨岩石、海底和移動中的小小輪廓，再換個角度比較光線。需要注意的是，官網八月十五日公告輪椅用階梯升降機故障，修復時間尚未確定；九月行程若需要無障礙協助，務必先向園方確認，不要把有室內觀察室誤當成全程無階梯。
  observationPrompt: "在已開放的觀察窗前，能分出固定的海底地形和移動中的生物嗎？不同窗戶的光線是否一樣？"
