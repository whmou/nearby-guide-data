  title: "フナハガー古井"
  summary: "三個早期村落圍繞的洞泉，後來又成為伊良部製糖用水的來源。"
  narration: "從村落取水到製糖工廠，一口泉的工作可以延續幾百年；看看泉口和後方樹林的位置，生活、信仰和產業，就落在同一張小小的地圖上。宮古島市的解說記錄，這一帶曾有フナパ、ウポザト、ウポドウ三個村落，フナハガー是它們發展的重要水源，發現時間則推定在1430年前後；後方的林地還有村落御嶽，並不只是無人照顧的荒林。更有意思的是，官方資料記下這口泉從1961年前後被用作伊良部製糖的工廠水源，古井的故事並沒有停在遙遠年代，也走進近代的生產生活。站在允許停留的外側，留意泉口如何接著較高的地面，再把周圍的村落道路一起看進來。從泉水到糖，人們依靠的都是這座島的土地；把兩段年代連起來，這口井就不只是「以前用過」的老地方。"
  observationPrompt: "從開放井外能看出泉口、地面與後方林地的高低關係嗎？不要進入洞泉或水源設施。"
