  title: "サバウツガー（佐良濱海邊古井）"
  summary: "沿海石階與古井，留著佐良濱兩百多年取用生活用水的記憶。"
  narration: "今天轉開水龍頭就有水，以前的佐良濱居民卻要把水從海邊帶回生活裡：サバウツガー是一口石砌井，市府記錄它直徑約一點五公尺、深約四點五公尺，井和周邊階梯一起被列為史跡。直到1966年八月簡易自來水設施完成以前，它已供居民使用兩百四十多年；看著上下相接的石階，取水的重量忽然變得很容易理解。名字裡的サバウツ，官方推測和從池間島望來、像鯊魚嘴巴的地形有關，這個語源仍是解釋，不是確定結論。這一站不必急著往下走，在安全開放的位置比較井、階梯和海岸的高度就好。海就在旁邊，能取用的水卻要另外辛苦尋找，這份反差，正是小小古井最值得記住的故事。"
  observationPrompt: "從安全陸側比較井、石階與海岸的高低關係，想像生活用水如何搬運回村落。"
