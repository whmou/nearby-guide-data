  title: "西平安名崎（展望台）"
  summary: "西平安名崎把池間島、池間大橋與伊良部島放進同一片海景；風力發電設施也留下宮古探索島嶼能源的痕跡。"
  narration: "先找找海上的池間大橋，再順著海岸輪廓辨認池間島；西平安名崎的看點，不只是一張有風車的照片，而是幾座島嶼如何在視線裡彼此相連。宮古島觀光協會將這裡介紹為宮古本島最北端兼最西端的岬角，可以眺望池間島、池間大橋和伊良部島，與東平安名崎伸向大海的印象形成對照。岸上的風力發電設施則被列為能源構想的一環，提醒人們：對離島來說，風不只是拍照時吹亂頭髮的東西，也曾被拿來思考如何供應生活所需的電力。看風機時不必期待每片葉子都正在轉，設備運轉情形不是導覽能保證的；也別用今天的日落方位套用全年。留在開放步道與觀景範圍，把橋、島和陸上的設施分別找出來，這片看似單純的海景就有了生活的線索。\n"
  observationPrompt: "從開放觀景位置辨認池間島、池間大橋與遠方陸地；找找風力設備和道路的相對位置，不越過護欄。"
