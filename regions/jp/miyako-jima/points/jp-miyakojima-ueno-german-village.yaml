  title: "ドイツ文化村"
  summary: "熱帶海岸旁的德式城堡，紀念的是1873年村民救援德國商船的歷史；園區與收費館舍須分開看待。"
  narration: |-
    在宮古島海岸看見德式城堡，第一個疑問往往是：它怎麼會出現在這裡？博愛紀念館仿照德國的馬克斯堡，但故事的起點不是城堡，而是一場海難。園方記錄，一八七三年，R.J.ロベルトソン號遭風災後擱淺，宮國與佐良濱的漁民參與救援，救出八名船員；語言不通，照料受難者這件事卻仍然繼續。三年後，德國皇帝派船送來紀念碑，立在能望見漲水港的地方，那座歷史石碑並不等於眼前這座後來建成的文化村。今天看城牆、尖塔與展覽時，可以把它理解為島民把一次救援記憶留給後代的方式，而不是德國人在這裡留下的古城。參觀前也記得分清楚：園區散步與進入博愛紀念館、兒童館是不同安排，館舍收費和開放情形以現場公告為準。
  observationPrompt: "從開放園區觀察博愛紀念館的城堡外形；若館內開放且已購票，再找救援年代與船名的展示，區分1873救援及1876立碑。"
