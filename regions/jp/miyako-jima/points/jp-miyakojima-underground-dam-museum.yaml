  title: "宮古島地下水壩資料館"
  summary: "用地層剖面、鑽探岩芯與影像，認識藏在地面下的農業水利工程。"
  narration: "如果你來找一面高高的水壩，這裡可能會讓你先愣一下：宮古島的地下水壩，完成後從地面反而看不見。資料館就在福里，把那個看不見的工程，用影像、解說和地層剖面帶到眼前。市府介紹特別提到館內展示實際鑽探取得的岩芯；看著一段段岩石，比只聽「地下水」三個字，更容易想像腳下還有不同的地層。展覽也說明砂川、福里地下水壩的建造技術與結構，讓沿路農田和水利設施之間的關係變得具體。參觀時可以先找剖面上的地層，再對照岩芯，問自己：哪些東西在地面完全看不出來？這是收費資料館，不是地下工程探險入口；依開館與館內標示參觀，別自行走進鄰近水利設施。"
  observationPrompt: "比較地層剖面與實物鑽探岩芯，哪一項展示最能幫你想像地面下的構造？"
