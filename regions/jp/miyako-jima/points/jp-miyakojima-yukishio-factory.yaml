  title: "雪塩製塩所"
  summary: "從粉末狀雪鹽看宮古島地下海水與製鹽工藝；參觀的是製鹽所旁的博物館，不進入生產管制區。"
  narration: |-
    先看看展示裡的鹽：它不是一顆顆粗大的晶粒，而是像粉末般細緻，這個外形正好把製程的問題帶出來。雪鹽品牌的說明指出，原料不是直接從岸邊舀來，而是從地下約二十二公尺抽取海水；濃縮後吹向加熱的金屬板，約兩秒讓水分蒸發，連通常分開的苦汁成分也保留下來，因此不是把粗鹽磨細才得到這種樣子。製鹽所旁的接待設施，在二〇〇二年開始形成工廠見學的體制，現在以雪鹽博物館的形式介紹這門手藝。看展板時，可以留意取水、濃縮與成粉三個階段的差別，再比較產品外觀；不必靠「世界第一」才覺得它有趣。實際製鹽區不開放進入，包裝作業也要看當天是否運作，請把影片、解說和允許觀看的小窗當作參觀範圍。
  observationPrompt: "在開放展示區比較粉末狀產品與製程示意，找出地下取水、濃縮、加熱成粉的先後；不進入生產區。"
