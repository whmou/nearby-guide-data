  title: "磯井（イスゥガー）"
  summary: "狩俣神歌裡的水源，把村落起源傳說與祭祀生活留在一口井旁。"
  narration: "如果村落的起點藏在一首歌裡，會唱到什麼？在狩俣，答案之一就是這口磯井，居民用它記住水源，也記住祖先：市府記錄的祖神祭神歌，描述創世神一路尋找泉水，最後在磯井找到適合供神的水，於是選擇上方的地點定居；這是神歌保存的村落起源傳說，不是已經確定的移民路線。文化財解說另記下，祭祀村落始祖神時，御茶湯中會加入磯井的水，讓古老故事和實際儀式有了連結。聽到這裡，再回頭看一口不算張揚的井，或許就能理解它的價值不在大小，而在居民持續賦予它的意義。若從開放外側看得到井口，可以留意它與地面的銜接，再對照村落位置；神歌裡泉水與居住地的關係，便有了可以理解的地形；水不只供人飲用，也替一個地方保存共同的記憶。"
  observationPrompt: "井口和周圍地面如何相接？請在開放外側觀察，不接觸供品或取水。"
