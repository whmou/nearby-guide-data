  parentId: null
  kind: "view"
  title: "砂山夕景（獨立展望台待確認）"
  summary: "以砂山海灘的白沙丘與夕景為背景；獨立展望台及公共入口尚未確認，觀景只使用海灘當天開放範圍。"
  narration: |-
    砂山的海景要先走過一座白沙丘，到了坡頂之後，沙灘與海面才展開，這段高低轉折也是海岸景觀的一部分。傍晚若天氣合適，可以在海灘開放範圍留意天空、海面與岩石輪廓的變化；夕景介紹說的是這片海灘，獨立展望台及其公共入口仍待確認，請勿另外尋路登上高台。面向海時，左側的琉球石灰岩拱岩很醒目，但下方因落石與崩落風險禁止進入，只能從允許停留的地方遠觀，不跨欄、不穿拱取景。回程還要爬過沙丘，請保留腳力，趁能辨清通路時返回，不為等待夕陽逗留在封閉區。海岸會受潮汐與風浪影響，想安排傍晚散步，請使用砂山海灘的到訪資訊並遵守現場標示，不把看夕景延伸成涉水活動。
  observationPrompt: "若已在砂山海灘的開放範圍，看看砂丘、海面與左側拱岩如何構成景觀；不跨欄、不穿拱，也不另尋高台。"
