  title: "宮古島サンセットクルーズ"
  summary: "宮古島日落遊船的背景與登船提醒；船型、航線和碼頭依具名業者而異，本筆不是固定集合點。"
  narration: |-
    上船前，先看船身的名字，再看登船口的指示，這兩樣往往比地圖上寫著「平良港」更有用。宮古島確實有晚餐遊船，例如モンブラン的官方說明，把集合處寫得很具體：在平良港停泊的船內一樓櫃檯辦理手續；同一頁也提醒，天氣與海況可能讓航程更動或取消。這是一家船公司的做法，不能套用到所有日落船、帆船或包船。從這個小細節就能理解，遊船不是海面上的一枚固定圖釘，而是一段由船、人與當天天候共同決定的行程。本筆沒有指定業者，所以不保證從哪個海灘出發、會繞到哪座島，也不保證看得到落日。確認預約後，依通知到正確登船口，在工作人員允許的區域留意港岸輪廓與天空的變化，別為了追最後一抹光靠近碼頭邊緣。
  observationPrompt: "抵達已預訂業者的集合地點後，核對船身名稱與登船口告示；只在允許停留處觀察岸線與天空。"
