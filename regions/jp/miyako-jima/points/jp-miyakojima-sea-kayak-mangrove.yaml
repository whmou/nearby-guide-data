  title: "島尻マングローブ シーカヤック"
  summary: "島尻紅樹林獨木舟屬需另行預約的活動主題；湧水、潮汐與樹根是觀察重點，不把步道地標當成通用集合處。"
  narration: "若已預約並由合格業者帶領，先留意樹根與水面的交界，而不是急著把船划進最密的地方；紅樹林值得看的，正是植物怎麼生活在海水與淡水交會的環境。島尻位在宮古島北部，教育委員會介紹這片林沿集落西側約一公里深的入江發展，湧水流入的條件也讓它具有植物地理上的意義，並非舊稿所說的南端河流。獨木舟是否能進入，則是另一件事：本次查到的REEF KNOT產品只在大潮前後的夜間安排，時間會隨潮位調整，不能推成每天都有的通用白天路線。這筆沒有選定一家業者的行程，也不提供集合GPS；如果沒有訂到活動，可以依開放規範從既有遊步道看樹根與泥灘，仍能讀到同一段生態故事，不需要自行把船推進林間。\n"
  observationPrompt: "在已確認開放的步道或業者指定路線，觀察水位與樹根、泥灘的相對位置；不離開允許範圍追逐動物。"
