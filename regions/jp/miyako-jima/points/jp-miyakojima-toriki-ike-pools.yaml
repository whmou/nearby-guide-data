  title: "通り池"
  summary: "兩口藍色池水嵌在石灰岩中，地下彼此相通，也通向外海；從陸側開放步道看地形，不把池水當成游泳池。"
  narration: |-
    通り池一大一小，直徑約七十五與五十五公尺，看起來分開的兩口池水，地下卻彼此相通，還經由海底洞穴連到外海，水深也隨潮汐變動。宮古島市的文化財解說將它的形成，解釋為石灰岩洞穴經過長年侵蝕、部分頂部崩落，留下今天的池水與中間相連的岩盤；從陸上看到的，其實只是這套地下地形露出的一部分。地方另有漁人觸怒海靈、海水淹來成池的傳說，那是居民傳述景觀來歷的故事，要和地質解釋分開來聽。沿開放步道觀察兩池的大小與岩壁輪廓，想像岩盤原本遮住水面的樣子，就能把眼前的形狀和地下洞穴連起來。這裡只從陸側觀景，不是入水點，請依護欄與封閉標示停留，不翻欄、不探身靠近池緣，也不下水。
  observationPrompt: "從開放步道比較兩池的大小，以及兩池之間保留下來的岩盤；不翻欄、不靠近池緣、不下水。"
