  title: "西ツガ墓"
  summary: "向下鑿開岩盤、再穿出拱門的墓葬建築，保留宮古少見的空壕配置。"
  narration: "這座墓最特別的地方，不只是石門的形狀，而是它像從整片岩盤裡挖出來：地面向下凹，前方再穿出通往墓庭的門，周圍還留了一圈空壕。宮古島市的解說把這種做法和一般「先砌牆、再放上頂石」的墓門相比，指出西ツガ墓的鑿岩方式相當少見；東西相鄰的兩座墓，都屬於益茂氏家族。名字裡的ツガ有人解釋成量穀物的升斗，對應四四方方的外形，也有「挖一升石、付一升粟」的地方傳說，語源並沒有單一確定答案。可以把它當成一個觀察題：不走進墓庭，只從開放外側看，哪些線條是岩盤被切開留下的，哪些又像後來堆砌？慢慢分辨，會比只拍一張正面照，更能理解這項工程花過多少心力。"
  observationPrompt: "從公共外側看，拱門附近哪些部分像原岩鑿出，哪些能看見石塊接縫？"
