  title: "与那覇前浜"
  summary: "約七公里延伸的白沙岸線，也承載宮古島鐵人三項的運動記憶；採實際Google具名海灘pin，不冒稱入口。"
  narration: |-
    先別急著找「最美海灘」的拍照角度，試著沿著岸線望遠：前濱真正讓人記住的，是白沙一路延伸、視線很難一次收完的尺度。沖繩觀光局介紹，這段岸線約有七公里，在宮古島也親切地被叫作「マイパマビーチ」。同一片沙灘不只出現在度假照片裡，還被介紹為宮古島鐵人三項賽的起點；想一想，平常散步的人與比賽出發的選手，會用多麼不同的步調看待這片海。今天不必追著紀錄或排行榜走，可以從安全的岸上比較近處沙線與遠處海面的方向，留意光線與雲影是否讓水色看起來不同。七公里是整段海岸的尺度，不代表要走完全程，也不代表每一處都適合下水；導航標示的是具名海灘，停車與下灘仍請依公共通路、現場告示與管理人員指引。
  observationPrompt: "從安全岸段沿著白沙岸線望遠，看看光線、雲影與不同遠近的水色；不要把顏色判作水深或安全依據。"
