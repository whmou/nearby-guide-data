  title: "前浜東岸"
  summary: "「前浜東岸」未查得獨立景點或入口；這筆只說明與那霸前濱的海岸背景，不將名稱疑點轉成另一個GPS。"
  narration: "白沙與海水交界的線條，可以慢慢看；但出發前，先把地名弄清楚，會比跟著一個看似精準的圖釘更重要。舊資料把這筆叫作「前浜東岸」，識別碼卻寫著島尻，兩者無法直接對上，本次也沒有查得獨立景點或正式入口。能確認的是，官方介紹的與那霸前濱位於下地與那霸，白沙綿延約七公里，當地也稱它「マイパマ」；那是一個已有其他導覽紀錄的真實海灘，不能悄悄拿它來替這個疑似誤記的名稱補座標。原本宣稱的東岸日出、固定少人與往東就有珊瑚，都缺乏支持，請不要照著這些方向尋路。若已在經確認的前濱公共範圍，看看乾濕沙面的分界與海色色帶就很好；這筆暫時只留作地名釐清與海岸閱讀，不是可執行的抵達指引。\n"
  observationPrompt: "若已在另行確認的前濱公共範圍，觀察乾濕沙面分界與海色色帶；不要按「東岸」這個未核實名稱尋找新入口。"
