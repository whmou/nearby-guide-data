  title: "博愛Waiwai海灘（岸上觀景）"
  summary: "在博愛漁港旁的小型人工海灘，看看休憩海岸、漁業空間與上野沿海生活的交會。"
  narration: "把目光沿著岸線移動，試著分辨沙灘和旁邊漁港的界線；同一片海，有人來休息，也有人靠它工作。Waiwai是博愛漁港旁一處小型人工海灘，官方介紹也特別提到周圍的甘蔗田和度假設施，讓這段海岸同時連著農作、漁業與觀光，不只是拍一張藍色海景那麼簡單。你可以留在岸上，看看港區和休憩空間怎麼並排，也想想旅客多留一點空間，對在地工作的人有多重要。官方提醒這裡不是依法指定的海水浴場，不能因為海面看來平靜，就當作有救生員或防護網的泳區；停車也不要占用漁港作業範圍。今天把它當作短暫看海的一站就很好，海龜是否出現不作期待，更不需要追著野生動物下水。"
  observationPrompt: "從允許停留的岸上，辨認休憩沙灘與漁港作業空間的界線，不進入工作區。"
