  title: "伊良部島灯台"
  summary: "舊文所稱「伊良部島西端白色圓柱燈塔」尚未確認正式名稱；保留待查，不套用池間、平安名埼或佐良浜港燈台座標。"
  narration: |
    看見海邊的燈塔照片，先讀正式名稱，往往比先猜它在哪一座島更有用。這一項原本叫作「伊良部島灯台」，但目前的官方資料與具名地圖結果，還不能把它對應到舊文描述的西端白色圓塔。海上保安部確實公告過伊良部島的「佐良浜港第一防波堤南灯台」；二○二五年的通知談的是燈器更換，以及燈光、構造物高度的變動，並不是開放觀光的通知。這讓我們看見，航標首先是航行設施，名字裡的港口與防波堤，也不能隨意省略成一座泛稱的島嶼燈塔。資料未釐清前，這段只作辨識提醒：不要照著舊座標去找海崖，也別走上防波堤尋找拍攝位置。若另有官方開放的燈塔景點，請使用它完整的名稱與獨立驗證的資訊。
  observationPrompt: "核對照片或說明牌上的完整航標名稱與管理單位；沒有同名官方資料和公共通行資訊，就不要據圖前往。"
