  locationHint: "官方旅遊頁標示的平良字荷川取人頭税石所在地，非停車場；在可通行範圍靠近說明與石柱，不攀爬、不妨礙周邊通行。"
  summary: "約1.43公尺的石柱保存人頭稅記憶；「高過石頭就納稅」應當作傳說，不能取代真正的制度史。"
  narration: |
    這根約一點四三公尺高的石柱，第一眼很容易讓人拿自己的身高來比。地方流傳，只要長得高過石頭，就得繳人頭稅；但請把這句話放在「傳說」的位置，不要理解成不分年齡、全靠量身高的正式制度。旅遊資料也明確提到十五至五十歲的課稅對象。比這個戲劇化說法更沉重的，是人頭稅從一六三七年延續到一九〇三年，跨過兩個半世紀；繳出的不只是抽象數字，還包括糧食與布匹。後來的廢稅運動，也不是一位英雄突然把大家救出來。市文化資產解說記錄，三十多個村落的農民支持四名代表遠赴東京請願。站在石柱旁，可以把問題換一下：一戶人家的收成和織布時間，有多少能留給自己？不用攀爬或觸碰，看看它在人身尺度中的大小，再想想背後那些共同爭取改變的人。
  observationPrompt: "不觸碰石柱，比較約1.43公尺的高度與人的尺度；閱讀說明時分辨量身高傳說與可查證的稅制、廢稅史。"
