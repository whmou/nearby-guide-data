  title: "宮古島まつり（クルバガー）"
  summary: "舊題名中的「クルバガー」及十月舟競說法未獲支持；改為分辨宮古島夏祭與ハーリー的文化介紹，不設定全年活動圖釘。"
  narration: |
    看到街上的祭典海報，第一件事不妨先找日期，再讀活動名稱；宮古島的節慶不是同一場熱鬧，換個名字，時間和意義也可能不同。市政府文化介紹把「ハーリー」放在農曆五月初四，以傳統船隻競渡，祈求漁業順利；「宮古島夏まつり」則是七月下旬的活動，包含地方歌舞。二○二六年的官方觀光活動頁列出七月二十四、二十五日，並非這次九月二十三至二十七日的行程。原題名裡的「クルバガー」，目前沒有找到足以證實其詞義與對應祭典的資料，因此不把它講成挖空木舟的方言，也不虛構一場十月大祭。如果旅途中遇到別的地方活動，就讀當年的公告，確認日期、場地和參與規則；看得見的儀式，不一定代表每個環節都歡迎遊客加入。
  observationPrompt: "看到當年活動公告時，先核對正式名稱、日期與場地；是否註明可供一般訪客觀看或參與的範圍？"
