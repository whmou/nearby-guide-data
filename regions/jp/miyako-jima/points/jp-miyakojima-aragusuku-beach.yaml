  locationHint: "宮古島觀光協會原始Google連結的海岸定位，地址城辺字新城；不是停車格或保證安全的下水口。停車空間有限，依現場告示使用公共海岸並判斷海況。"
  summary: "新城讀作あらぐすく；近岸淺瀨與珊瑚是官方介紹的特色，但水色漂亮不等於當天海況適合下水。"
  narration: |
    先把視線放在沙岸和海水交接的地方：同一片海面，顏色並不一定均勻，亮處、暗處值得慢慢分辨，但單靠水色不能判斷深度或安全。新城海岸的日語讀法是「あらぐすく」。市府介紹它時，特別提到近岸淺瀨的珊瑚與熱帶魚，這也是許多人想來親近海洋的原因；不過，今天能看到什麼，仍取決於能見度與海況，並不是一張保證有海龜或滿眼珊瑚的門票。另一個容易被忽略的細節在岸上：官方觀光資料列有連接縣道的海岸道路、廁所和停車空間，同時提醒車位有限。這些小設施，決定了一處自然海岸怎麼接待來客。你可以先在岸邊看看入口、告示與可停留區，再決定如何活動；別把「淺」理解成沒有潮流，也不要為了站穩而踩上珊瑚。把海岸當作有生命、也有人照料的地方，停留會更踏實。
  observationPrompt: "先從岸上找入口、安全告示與可停留區，再觀察水色差異；不以水色推斷可踩踏的礁石或下水路線。"
