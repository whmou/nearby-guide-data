  title: "伊良部大橋海の駅"
  summary: "橋畔高台的休憩與物產設施，把伊良部海景、農產和餐桌放在一起。"
  narration: "橋可以縮短兩座島的距離，一頓飯則能把島上的生活拉近：伊良部大橋海の駅位在能望見大橋與海面的高台，除了看景，也是認識伊良部食材的一個停留點。營運者說，餐廳優先使用島內食材，連因大小或形狀不合一般流通規格的蔬菜，也會向地方農家取用，讓看起來不夠整齊的收成仍能進入餐桌。店家介紹的鰹魚飯，則在沖繩炊飯じゅーしー裡加入伊良部產的なまり節，也就是經過初步加工的鰹魚製品，把地方漁業接到一碗家常飯裡。可以看看物產標示和菜單上的產地，再從開放的觀景位置找出大橋方向。眼前的橋連著交通，店裡的食材連著農家與漁家，這樣的一站，休息也能順便認識島。"
  observationPrompt: "在商品或菜單上找出伊良部的產地標示，再從開放觀景位置辨認大橋方向。"
