  title: "古謝そば屋（宮古そば）"
  summary: "古謝そば屋從1932年的食堂起家，店史中的疏散、重開與麵粉交換，讓一碗宮古麵連上島民的日常。"
  narration: "紅瓦屋頂、木質座位，還有窗邊可以看見的庭院，先讓一碗麵有了不趕時間的背景；但古謝そば屋最值得聽的，未必是配料藏在碗底的說法，而是這家店如何把麵繼續做下去。店家年表記載，一九三二年古謝將功在平良開食堂，戰爭期間一家疏散到臺灣而停業，回島後重新開始；店史還提到，曾用做好的一份份麵，交換各家配給的小麥粉，讓缺乏原料時仍有辦法營生。早年的麵以木灰上澄液、鹽與麵粉製作，如今則在有衛生管理的工場生產，不必假想每一碗都還是當場手擀。等餐時可以看看店裡的木作與庭院，再留意自己那碗麵的形狀和配料位置；眼前端來什麼就觀察什麼，不先規定它一定得符合某種「傳統擺法」。\n"
  observationPrompt: "看看實際端上的麵條、配料位置，以及窗邊庭院與木質座位；它和你原先想像的老店有什麼不同？"
