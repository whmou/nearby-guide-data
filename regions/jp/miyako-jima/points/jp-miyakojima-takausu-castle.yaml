  kind: "attraction"
  title: "高腰城跡"
  summary: "比嘉北側山丘上的城郭遺址，從天然石砌礎石認識琉球統治前的宮古。"
  narration: "如果你期待的是一座高大的天守閣，高腰城跡會請你把視線放低。這裡真正值得看的是山丘上的天然石砌與城壁礎石，官方記錄遺址東西約七十公尺、南北約四十公尺，坐落在比嘉聚落北側的丘頂。宮古舊記把城主記作高腰按司，而考古發掘找到十三至十五世紀的土器、陶瓷、古錢和鐵製品，讓這座城不只活在人物傳說裡，也留下可以研究的實物線索。它幫助我們理解琉球王國勢力進入前，宮古地方社會的樣子。慢慢辨認石塊排列成的邊界，比急著找一棟完整建築更有收穫；請只走現場開放的參觀動線，不爬石壁、不採集碎片，草木遮蔽或路面封閉時就在公開解說位置停留。"
  observationPrompt: "開放動線旁的石塊，哪些看來形成連續排列的城壁或礎石邊界？"
