  title: "大神島"
  summary: "大神島的海岸奇岩、燻章魚保存食與祭祀界線，展示海島生活的不同面向；全島主題不當成單一抵達點。"
  narration: "從開放的海岸路段看大神島的岩石，留意靠近水面的部分：有些岩塊上方寬、下方窄，像一頂帽子擱在細腳上。官方觀光資料把這類海蝕凹口稱為「ノッチ」，海浪長久侵蝕水面附近，留下了這些不尋常的輪廓；欣賞形狀就好，不要靠近岩石下方。島上的生活也回應著海況，例如名叫「カーキダコ」的燻章魚，來自把漁獲做成保存食、預備風浪天無法出海的日常智慧，不只是旅人的一道特產。大神島又有多處居民長年守護的聖域，祭祀期間連平常可到的地方也可能限制進入，是否開放要向島上確認，而不是照著地圖小徑走到底。這筆說的是整座島，沒有把島中心或出發港當成抵達座標；跟著允許的路線，把自然形狀與生活規矩一起看，才比較接近島嶼真正的面貌。\n"
  observationPrompt: "在居民或導覽確認可進入的海岸路段，遠看奇岩上寬下窄的輪廓；留意沿途界線告示，不進入岩下或聖域。"
