  title: "下地島"
  summary: "與伊良部島隔水相鄰的下地島，串起飛行訓練、海蝕洞穴與潮汐漁法；本筆是全島背景導覽，不提供單一抵達點。"
  narration: |-
    隔著窄窄的水道，伊良部島和下地島看起來像一對靠得很近的鄰居；過橋時不妨留意兩岸的輪廓，這是認識下地島最直觀的開始。沖繩觀光局的島嶼介紹指出，下地島機場原本是為飛行員訓練而建，大片機場用地讓這座小島有了很鮮明的航空面貌。另一段比較安靜的生活史，則留在佐和田礁湖的魚垣：人們在海中堆起石牆，利用潮水漲退捕魚，讓海的節奏成為日常工作的幫手。島上的通り池又呈現另一種地下與大海相連的地形，不需要把每個景點都塞進同一個停車位置。這一段適合在移動時聽，各個海岸、機場與步道仍要分別確認入口；看見管制標示就停下，不跨進機場或礁湖尋找捷徑。
  observationPrompt: "經合法公共道路過橋或停妥車後，看看水道如何分開兩島；不要在橋上停車，也不下礁湖追尋魚垣。"
