  kind: "venue"
  title: "仲原鍾乳洞"
  summary: "由業者接待的天然洞窟，以入口植物、岩壁與地下空間認識長時間的水作用。"
  narration: "周圍是田地，洞口卻藏在地面以下；來到仲原鍾乳洞，第一個有趣的地方就是這個高低差。業者介紹說，入口約在地面下十五公尺，附近長著樹木，得先經過陡階才能抵達，並不是無障礙的平地展館。天然洞穴由地表水、地下水長時間侵蝕而成，慢慢看岩壁的起伏，會比急著替每一塊石頭取名字更有意思。這裡有正式收費參觀及入場人數管理，不需要自己尋找野洞，也不能把網路上「很好走」的形容當作安全保證。先在接待處確認路況與自己的體力，再按管理者開放範圍參觀；穿穩固鞋子、不碰鍾乳石，不為拍照進入低矮或未開放的支洞。九月行程出發前仍要確認臨時休業，給這一站留一點彈性。"
  observationPrompt: "在業者開放路線上比較入口的植被、岩壁與洞內空間形狀，不觸摸或敲擊石體。"
