  kind: "attraction"
  title: "池間遠見番所跡"
  summary: "小丘上的石造瞭望遺跡，記下昔日海上消息如何傳回宮古。"
  narration: "沒有手機、也沒有無線電的時候，海上多了一艘陌生船，消息怎麼傳回城裡？池間島南端這座小丘，就是早期通訊網的一個節點：宮古島市介紹，遠見番所制度在1644年設置，用來監視往來船隻，並以烽火等方式通報；池間遠見利用岩盤築成圓柱狀，旁邊留有上下的石階。官方還記錄，這裡直到1950年代初仍有一根用來確認船隻方位的圓柱形方位石，如今不必期待它仍立在原處。從允許停留的位置望出去，再回頭看看石階與岩盤的關係，會發現選址不是隨意挑一個漂亮角落：看得遠，當時就是很實際的工作條件。現在我們來看海，而曾經在這裡輪值的人，看的則是船往哪裡去、消息該怎麼傳。"
  observationPrompt: "在開放路徑上對照石階、岩盤與海上視野；思考瞭望位置如何影響訊息傳遞。"
