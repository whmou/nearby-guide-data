  title: "佐和田の浜"
  summary: "佐和田之濱的淺礁湖散布大小岩塊，海嘯傳承與傳統魚垣讓海景同時留下自然與生活的記憶。"
  narration: "先別急著往遠處的岩石走，留在岸邊看看它們的排列：有的大、有的小，散在淺淺的礁湖裡，讓佐和田之濱不像一片平整空白的沙灘。官方觀光頁記載，這裡在一九九六年入選「日本渚百選」，並介紹三百多塊大小岩石，相傳由一七七一年的明和海嘯等巨大浪潮帶來；教育委員會也提到不只一次古海嘯的說法，所以不能把每塊石頭都斷言成同一年、同一道浪的作品。這片礁湖也曾是居民重要的漁場，域內留有利用潮汐捕魚的魚垣，把海水進退變成生活的幫手。你可以比較岩石底部與水面的關係，再從安全岸側留意海色和露出範圍；不用爬上岩石，也不必追到礁湖深處，已能感覺到同一片海如何既養人，也讓人學會敬畏。\n"
  observationPrompt: "從安全岸側比較大小岩塊、底部水線與礁湖色帶；若能辨認石列也只遠觀，不走向外礁或攀爬岩石。"
