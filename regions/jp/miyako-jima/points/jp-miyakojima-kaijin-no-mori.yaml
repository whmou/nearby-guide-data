  title: "海人の森"
  summary: "尚未確認宮古島具名「海人の森」場地；不把島尻或川滿紅樹林改名套用，保留無GPS的名稱辨識提示。"
  narration: |
    看旅行資料裡的綠色水岸照片，先找找旁邊寫的地名；都是紅樹林，並不表示走的是同一條步道。原本這一項叫作「海人の森」，但目前查到的官方景點資料與具名地圖搜尋，還不能確認宮古島有哪一處場所對應這個名稱。觀光協會確實介紹「ウプカーマングローブ」，也叫川滿紅樹林，位置和川滿漁港的大川湧水有關；官方另有島尻紅樹林介紹，那又是不同的地點。這些名字可以幫我們分清楚資料，卻不能拿其中任何一處的座標來補上「海人の森」。因此這裡暫時沒有導航，也不承諾木棧道、可見動物或參觀設施。若想安排紅樹林行程，請另選有正式名稱和公共通行資訊的景點；到了現場也以開放步道為界，不為拍照踩進泥灘或根系間。
  observationPrompt: "先核對地名、地區與管理資訊：資料說的是川滿、島尻，還是另一個有正式名稱的場所？不要僅憑景觀照片認定相同。"
