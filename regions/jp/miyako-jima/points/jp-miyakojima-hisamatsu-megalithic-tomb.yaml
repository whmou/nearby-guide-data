  title: "久松巨石墓群（久貝ぶさぎ）"
  summary: "以官方標示的久貝墓體為觀察點，認識久松稱為「ぶさぎ」的巨石墓文化。"
  narration: "眼前的大石板與石塊，先讓人想到一個很實際的問題：在沒有現代吊車的時代，人們怎麼把它們組成穩定的空間？久松地方把這類巨石墓稱作ぶさぎ，市府介紹的墓群跨越久貝、松原兩個地區，記錄到四座；我們停留的是官方圖釘所指的久貝側墓體，不是要沿著導航去找遍每一座。研究者大致把建造年代放在十四到十六世紀，至於技術怎麼發展，則有本地風葬墓逐漸變化、以及外來技術影響等不同解釋，還不能說只有一個答案。從允許通行的外側，看看蓋石如何搭在下方石塊上，接合處有沒有明顯的大小差別。大小不同的石材如何彼此支撐，正是這一站最耐看的細節；墓群也讓久松的聚落故事，多了一段留在石頭上的時間。"
  observationPrompt: "在開放外側能看見蓋石與支撐石的接合嗎？只用目光比較石材尺度，不觸碰或攀爬。"
