  title: "吉野海岸生態觀察（不保證海龜相遇）"
  summary: "吉野海岸約五百公尺白沙與近岸珊瑚礁構成觀察背景；海龜屬野生動物，不保證相遇，也不提供追龜或入水導航。"
  narration: |-
    吉野海岸約五百公尺長的白沙灘旁，就是珊瑚礁環境；沖繩觀光資料介紹了近岸的硬珊瑚、軟珊瑚與熱帶魚，認識這片海，不必只把目標放在海龜身上。留在安全岸側，可以先看看沙岸和海水的交界、不同深淺的海色色帶，再留意潮汐變化如何影響眼前的水域。這裡容易受潮漲潮落影響，即使海面看起來平靜，也要先確認當天海況、監視員與防護網等現場情況，是否適合入水另向專業業者詢問。海龜的出現沒有保證，不為尋找牠而自行下水、離開允許範圍；若有機會遇見，也不追趕、圍堵或觸摸，讓牠自在移動。沒有遇到海龜時，仍可從岸上慢慢看這片海岸的形狀，把注意力留給沙灘、海色與現場安全標示。
  observationPrompt: "留在安全岸側比較沙岸與不同海色色帶，留意潮位及現場安全標示；不為找海龜自行下水或離開允許範圍。"
