  summary: "池間島整體的生活與文化導讀，連結大橋及地方祭祀；島嶼不是單一入口，不提供任意中心GPS。"
  narration: |
    看著橋接上海岸、道路走進聚落，可以先提醒自己：池間島不只是一圈漂亮的海。全長一千四百二十五公尺的池間大橋在一九九二年二月通車，讓兩座島以道路連起來；橋以外，島上也有自己的社會節奏。官方文化資產介紹的ミャークヅツ，是以四個「ムトゥ」為中心、延續三天的地方祭祀，主要由虛歲五十五歲以上男性為核心的年齡組織運作。這些名字與年齡分工，說的是居民如何一起承擔信仰生活，不是為了旅客臨時排出的節目。走在允許通行的道路上，可以留意公共交通空間和住宅、祭祀場所之間的界線；即使沒有遇到祭典，也不必覺得少看了什麼。這筆是整座島的導讀，沒有把島中央設成到訪終點。真正停留時，請另選已核實的橋頭或景點，尊重居民作息，也不要推定九月旅期就能旁觀儀式。
  observationPrompt: "在公共道路留意住宅、交通與祭祀空間的界線；具體停留請使用已核實的子景點，不循島中心尋找入口。"
