  title: "宮古島市公設市場"
  summary: "下里一番地的宮古島市公設市場，把島野菜、海產加工品與日常飲食放在同一處；從產地標示讀懂島上的餐桌。"
  narration: "先看商品旁邊的小標籤：產地寫在哪裡、是當季蔬果還是加工食品？逛宮古島市公設市場，不必先預設整條街都在賣清晨捕獲的魚，反而可以從一兩件商品慢慢認識島上的日常。市政府設立這座市場，是為了推動在地生產、在地消費，也讓居民採買更方便；官方地址是平良下里一番地，並不是一座另有正式名稱的「西里公設市場」。市府介紹的攤位內容包括島野菜、宮古味噌、海葡萄與海藻料理，也有豆腐、惣菜及飲食店，說明市場不只是生鮮買賣，更把保存、加工與吃飯連在一起。實際營業的攤位和商品仍會變動，可以看看一種原料如何變成不同食品，再讀包裝上的製造地；想問店家時，等對方忙完眼前的工作，這樣的停留比只找一張熱鬧市場照片更有收穫。\n"
  observationPrompt: "在當天開店的攤位比較產地標籤與加工食品名稱；能否找到同一種島產原料的不同做法？拍攝攤位或人物前先詢問。"
