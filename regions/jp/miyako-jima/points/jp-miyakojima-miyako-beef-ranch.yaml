  title: "宮古牛農場"
  summary: "宮古牛與畜牧業主題，並非已確認的觀光牧場；可從菜單、產地標示認識地方農產，未提供私人牧場定位。"
  narration: |
    菜單上看見「宮古牛」三個字時，可以先把目光從漂亮的肉片照片移到食材說明：這份餐點，怎麼和島上的農業接起來？ＪＡ沖繩的あたらす市場介紹，將宮古牛列在地方特色商品之中；宮古農業改良普及課的工作資料，也把肉用牛和甘蔗並列為需要推動生產的項目。這些記錄讓牛肉不只是旅遊菜單上的名字，也連著飼養與供應的日常。觀光協會介紹的在地餐廳，則清楚分開宮古牛與阿古豬，點餐時值得逐項確認，不要把一張沖繩肉品照片就當作相同食材。至於原本叫作「宮古牛農場」的這一項，目前沒有具名、允許遊客進入的牧場；想了解飼育，應先找到有正式參訪安排的業者，不靠近牛舍、不餵食，也不把私人農地當成免費動物園。
  observationPrompt: "讀菜單或商品標示時，宮古牛與其他牛、豬肉是否分開寫？向販售者確認產地，不以照片推定飼養方式。"
