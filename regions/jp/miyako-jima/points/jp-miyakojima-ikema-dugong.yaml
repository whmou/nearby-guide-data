  summary: "儒艮與海草床保育的閱讀主題，不是池間島保證可見儒艮的觀賞點；調查海域不能直接變成導航座標。"
  narration: |
    望著海面時，沒有看到動物，不代表這片海沒有值得保護的生活。儒艮吃的是淺海海草，可是要判斷牠是否利用某片海域，研究人員不能只靠一張漂亮水下照片。環境省的調查先分析空拍影像，找可能的攝食痕跡，再由潛水調查查證，也蒐集漁民的觀察；「像是吃過的痕跡」和「親眼見到儒艮」，是不同層次的證據。報告的調查範圍包括池間島，也包括來間島和伊良部島，不能把池間說成宮古唯一確認的生息地，更不能承諾清晨來就會看到。這筆保留為保育主題，沒有固定賞儒艮平台，也不提供追逐牠們的下水位置。若想了解，可以從報告裡的海草與調查方法讀起；把注意力放在棲地如何被辨認、如何與漁業共同照顧，比替一次旅行許下難以兌現的目擊願望，更接近這個故事的核心。
  observationPrompt: "閱讀官方報告時，分清海草分布、疑似攝食痕跡與個體目擊三種證據；不按調查圖自行出海追尋。"
