  title: "中の島チャンネル（ダイビングスポット）"
  summary: "中之島 Channel 是下地島中之島灣的水下地形潛點，以裂隙與拱洞為特色；不是宮古本島旁的漂流海峽或陸上入口。"
  narration: "如果已由專業業者評估並帶領下水，中之島 Channel 值得留意的，不是跟著強流一路漂走，而是岩礁之間像通道一樣的裂隙；人在不同角度看它，地形就可能從一堵牆變成一道開口。實際經營這個潛點的業者，把它列在下地島的中之島灣，介紹的重點是裂隙、拱洞，以及光線從上方落進裂縫的景象，並非宮古本島與某座「中之島」之間的海峽。業者列出的深度範圍是五到二十二公尺，但那是潛點資料，不是每個參加者都能自行採用的下潛計畫。這筆保留的是海底地形故事，沒有固定集合處，也不把岸邊海灘的圖釘冒充洞口；能走哪條水下路線、當日能否入水，請交給你預約的專業團隊決定，不為追逐一道光而偏離導潛。\n"
  observationPrompt: "僅在專業導潛允許的路線上，留意岩礁裂隙與拱洞的形狀、亮暗交界；不要自行進入狹窄空間。"
