  title: "姆伊嘎斷崖展望處（ムイガー）"
  summary: "從崖頂公共展望設施看七又海岸，認識隆起珊瑚礁斷崖與地下水的生活史。"
  narration: "把視線沿海岸慢慢移動，你會發現這裡的主角不是一個孤零零的觀景台，而是一整道向遠方延伸的斷崖。觀光協會把七又海岸介紹為由隆起珊瑚礁形成、高約三十公尺的斷層海岸；崖下有稱作姆伊嘎的泉水，海景與居民的用水史其實連在一起。地方報導記錄，這處展望設施在二〇一九年二月底完成，增設步道、涼亭等休憩空間，居民也一起種植樹苗。更早的一九五七至一九七〇年間，崖下泉水曾供應附近聚落的簡易自來水。站在崖頂，試著同時看見海岸的長尺度和一口泉支撐日常的小尺度。請只走開放的上方觀景動線，不沿陡階下崖找水；看板提到的鯨魚，也不是九月旅行可以預約的景色。"
  observationPrompt: "從崖頂開放展望處，海岸的崖線如何延伸？能否辨認人工步道與自然斷崖的界線？"
