  title: "魔王の宮殿（洞窟ダイビングスポット）"
  summary: "下地島的船潛點，以狹暗通道、拱形空間與縱向洞室間的光影為特色；須具備適當資格與經驗，由專業業者評估參加條件。"
  narration: |-
    在下地島海底，「魔王の宮殿」的狹暗通道、拱形空間和深處較大的縱向洞室，構成鮮明的地形變化。沖繩觀光資料介紹的看點，是洞頂開口透入的光與周圍岩壁形成的明暗對比；狹窄與開闊的空間交替，可以留意光線如何勾出不同的洞室輪廓，但實際景象仍受當天條件影響。這是水深約二十七公尺的船潛點，官方列為中級以上、需進階資格，不能從陸路步行進洞，也不適合當作一般海灘浮潛的延伸。若考慮參加，先讓合格業者確認你的訓練、經驗、當天海況與集合地點，再決定行程。只有在業者評估適合、帶領到訪並允許停留時，才觀察洞室輪廓與明暗變化，不自行尋找岸邊入口或探索通道。
  observationPrompt: "若已由合格業者評估並帶領到訪，從導覽允許的位置觀察洞室開口、岩壁與明暗交界；不自行探索通道。"
