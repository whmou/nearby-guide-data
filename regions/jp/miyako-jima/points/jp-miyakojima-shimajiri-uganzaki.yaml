  title: "島尻のマングローブ林"
  summary: "宮古島北部的島尻紅樹林沿入江生長；湧水與海潮交會，加上2002年完成的橋與遊步道，讓陸上散步也能讀懂海邊森林。"
  narration: "把視線從樹冠往下移，看看樹根與泥灘相接的地方；島尻紅樹林的主角不只是一片綠，還有水來水去留下的邊界。這裡在宮古島北部，教育委員會介紹，林地沿著島尻聚落西方約一公里深的入江發展，是宮古諸島規模最大的紅樹林群落，湧水流入的環境也是它在植物地理上受到重視的原因。紅樹林不是一種樹的名字，而是一群能在這類海岸環境生活的植物，觀察時可以先看葉形、枝幹與根的位置，不必急著猜每棵的學名。觀光協會另記載，島尻橋與遊步道在二〇〇二年九月完成，讓人更容易從陸上接近並認識這片林。沿開放步道慢慢找不同形狀，已經是一趟完整的觀察；看到泥灘上的動靜也只需停下來看，別為找蟹或拍照踏進根系，這裡不必搭獨木舟才算到訪。\n"
  observationPrompt: "從開放遊步道比較不同樹木的葉形、枝幹與根的位置，看看水線如何接到泥灘；不踏入泥地或折取植物。"
