  locationHint: "導航至池間湿原展望台的觀察位置，不是濕地中心或停車場入口。沿道路與現場『池間湿原』指標抵達；只在開放的觀察設施停留，勿穿越濕地、翻越圍欄或為觸發而離開通行區。遇封閉標示不進入；不保證旅期開放或鳥況。"
  summary: "池間島中央約38公頃的濕地，曾是海灣，因港口工程後逐漸淡水化；請只在指定觀察區看水面與植被。"
  narration: |
    到了展望台，看看開闊水面和成片水生植物怎麼交錯。池間濕地面積約三十八公頃，雖然被海包圍在小島中央，它的淡水環境卻不是從來如此。環境省的介紹說，這裡過去是一處海灣，港口工程使灣口封閉，之後逐漸淡水化。看似安靜的一片水，也留下了人為工程改變環境的歷史。它被列入日本重要濕地五百，池間鳥獸保護區則在二〇一一年設定。對鳥來說，水面、草叢和周邊棲地的差異都很重要，但今天會有哪種鳥出現，沒有辦法保證。不妨先觀察植被邊緣和開水面的分布，有鳥時再安靜看牠的活動。導航標的是展望台，不是濕地中央；循道路與現場指標到觀察位置，若設施封閉就不要進入。不穿越濕地、不以聲音或食物引鳥，把一點不被打擾的空間留下來。
  observationPrompt: "從指定觀察位置比較水生植物與開闊水面的分布；安靜等待，不保證鳥種、不餵食，也不穿越濕地。"
