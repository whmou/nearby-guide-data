  title: "牧山展望台"
  summary: "像灰面鵟鷹展翅的白色展望台，從伊良部高處讀懂離島與海的關係。"
  narration: "一隻白色大鳥停在山頂上——走近才發現，它其實是讓人看風景的展望台：牧山展望台以候鳥灰面鵟鷹，也就是日本人說的サシバ為造型，展開的雙翼讓建築本身也成了觀景的一部分。觀光協會介紹，這裡位在伊良部島東南側的高處，是島內最高的地方，可以朝宮古本島、池間島與來間島的方向展望；實際看得多遠，還是得看當天能見度。站定後不妨分兩次看：第一次看白色建築的輪廓，第二次把視線放遠，找出海面與島岸的交界。開車過橋時，海是一路向後退的背景；來到這裡，幾座島終於能放在同一張腦中的地圖上。這一站不用趕著離開，慢慢認方向，本身就是旅行很舒服的一小段時間。"
  observationPrompt: "比較展望台的雙翼輪廓，再辨認宮古本島與遠處島岸；能見度不足時不必勉強找齊。"
