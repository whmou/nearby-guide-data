  title: "仲宗根豊見親の墓"
  summary: "仲宗根豐見親之墓結合宮古巨石墓與橫穴式樣；墓前屏牆與頂部石柱，比「龜甲墓」的套用更能說出地方特色。"
  narration: "先看墓前擋住正面的石牆，再把視線移到墓室上方：那排短石柱，不只是讓外觀顯得整齊的裝飾。宮古島教育委員會介紹，豐見親墓群的石柱頂端有凹口，祭祀時可架上木料、樑與覆蓋物，讓石造墓葬暫時多出屋頂；一個小缺口，就把家族祭祀的做法留在建築上。這座墓與十五世紀末至十六世紀初的宮古首長仲宗根豐見親及忠導氏一門有關，市府另保留他為父親建墓的傳說，但傳說年代不能直接等同眼前每塊石頭的年代。墓制結合宮古原有的巨石墓和沖繩本島橫穴式樣，別急著把它叫成常見的龜甲墓。從開放的外側比較屏牆、墓體與石柱，已足以看出不同地方的建築知識如何相遇；這裡仍有家族祭祀意義，不必跨入墓域才能理解它。\n"
  observationPrompt: "從開放外側找找墓前屏牆與墓頂短石柱；能否看見柱頂凹口？請勿攀爬、觸摸或進入墓室。"
