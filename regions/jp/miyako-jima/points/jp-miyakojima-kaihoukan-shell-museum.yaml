  title: "宮古島海寶館・貝殼博物館"
  summary: "從巨型貝殼到各式螺紋，認識城邊出身館長長年累積的世界貝類收藏。"
  narration: "進到海寶館的貝殼展示區，先別忙著記名字，挑一個形狀最讓你好奇的貝殼，看看它的螺紋或外緣。沖繩觀光資料介紹，這批收藏來自城邊出身的館長，花了約五十年從世界各地蒐集，累積超過一萬件；原本屬於一個人的好奇心，慢慢成了讓大家認識海洋的博物館。入口介紹的巨型硨磲，和展櫃裡不同大小、形狀的貝類放在一起看，更容易感覺到「貝殼」其實不是單一模樣。這裡另有把貝殼做成風獅爺、相框或飾品的手作體驗，能不能參加、費用與材料都先問工作人員。看展時不妨選兩件外形差很多的標本，找找各自最醒目的線條；想留下一份紀念，用照片或館內允許的活動就好，不必到海邊採集活物。"
  observationPrompt: "選兩件外形差異明顯的貝類標本，比較螺紋、開口或外緣的線條。"
