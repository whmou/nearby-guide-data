  title: "パイナガマビーチ"
  summary: "平良市區旁的 Painagama 海灘是居民日常親海的地方；觀察沙岸、公共設施與外側航路的距離，也能理解海灘的使用界線。"
  narration: "站在沙岸旁，先回頭看一眼市街，再望向海面；Painagama 特別的地方，就是城市生活與海邊休息靠得這麼近。官方資料把它介紹為平良市區旁、深受居民親近的海灘，白沙之外還有洗手間與淋浴等設施，不必安排一整天的遠行，也能把海岸當成散步的一部分。可是「離市區近」和「看起來平靜」，都不是任何人都能安心下水的保證：宮古島觀光協會特別提醒，外側海域是航路，防護網外亦有箱型水母風險，而防護設施與現場管理情況必須當天確認。你可以留在陸側，看看沙岸和通行道路如何銜接，辨認告示所畫的活動範圍，再比較近岸與遠處的海色。把這裡當成居民日常使用的海邊，而不是沒有規矩的泳池，就更能欣賞這份靠近城市的輕鬆。\n"
  observationPrompt: "從陸側比較沙岸、市街道路與海面的位置，找找現場安全告示和活動範圍；不要為看清航路而走入海中。"
