  title: "住屋遺跡"
  summary: "同一片街區，從中世紀聚落變成王府派駐官員的住處。"
  narration: "如果把眼前這片街區一層層往回翻，最先遇到的未必是官署，而是普通人住過的家：住屋遺跡大約屬於十四至十七世紀初的聚落，1982年的兩次發掘，找到了較早的竪穴住居，以及後來的平地、石鋪住居等遺構。同一個地方保留不同年代的房屋形式，是它特別有意思的地方：人們怎麼住，會隨時間改變。1629年，這裡又設置了在番仮屋，也就是琉球王府派來督導地方官員的人的住處，之後更長期與地方行政相連。這些地下構造不一定都能在現場直接看見；如果設有解說牌，可以和周圍街道一起對照，想像聚落的位置。旅行時很容易只記得一棟醒目的建築，這裡卻提醒我們，同一片土地曾有好幾種完全不同的日常。"
  observationPrompt: "對照現場解說與周圍街道，分辨考古發現的住居年代和後來行政用途，不把未裸露遺構當成眼前可見。"
