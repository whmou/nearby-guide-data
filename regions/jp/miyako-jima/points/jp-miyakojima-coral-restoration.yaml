  summary: "宮古海域珊瑚修復的主題導覽：植入之後仍需多年清潔和觀察，並非已確認可自由入場的展示中心。"
  narration: |
    看到珊瑚育苗架的照片，可以先問一個不那麼像觀光行程的問題：種下去以後，誰繼續照顧？伊良部的 Reef 業者公開介紹，自己與伊良部島漁協、環境協會合作，植入珊瑚，也設置育苗架。但最值得注意的，不是一次放下多少株，而是後面的時間：依它記錄的做法，珊瑚能獨立成長前，可能需要五年以上持續清除附著海藻，還得觀察天候與海況造成的變化。修復因此不是拍完種植照片就結束，而是一次次回去看看、整理、再記錄。若日後參加經確認的導覽，可以請業者用照片或紀錄說明同一處珊瑚前後的差異，別自行觸碰或清理。這筆目前是保育主題，並沒有一座已核實的固定「再生中心」可以導航；公開的合作案例，也不代表旅期一定有開放名額，需另向承辦者確認。
  observationPrompt: "閱讀業者的育苗架照片與維護紀錄，比較一次種植和長期照料的工作；未經指導不觸碰珊瑚。"
