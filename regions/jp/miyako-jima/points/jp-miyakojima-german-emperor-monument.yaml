  title: "德國皇帝博愛紀念碑"
  summary: "平良港旁的雙語紀念碑，記下宮古居民救助德國遇難船員的跨海往事。"
  narration: "一座石碑，為什麼同時刻著德文和中文？上方是德文，下方和背面則是中文，同一場海難，就這樣留在宮古島市街的一塊石碑上。1873年，德國商船羅伯遜號在宮古南岸擱淺，居民救起八名船員，照顧了一個多月，還提供船隻讓他們返鄉；消息傳到德國，皇帝威廉一世派軍艦前來，這座碑於1876年建立。別把這裡和南岸的德國文化村混為一談：眼前是靠近漲水港的紀念碑，救援卻發生在另一側海岸，一塊碑把兩端的地方記憶連了起來。慢慢比較不同文字在碑面上的排列，不一定要逐字讀懂，也能看見這段謝意如何跨越語言；讀完再想想，讓遠方的人記住宮古的，是居民照料陌生人的行動。"
  observationPrompt: "碑面哪些區塊使用德文，哪些使用漢字？請在可通行範圍內比較，不攀爬碑座。"
