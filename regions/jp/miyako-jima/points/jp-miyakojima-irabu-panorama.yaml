  kind: attraction
  title: "伊良部大橋展望"
  summary: "名稱尚不能對應唯一展望設施；保留看橋的閱讀提示，不混用橋頭、牧山展望台或いらぶ大橋海の駅的定位。"
  narration: |
    照片裡同一座伊良部大橋，為什麼有時幾乎與海平面相貼，有時又能看見長長的弧線？先留意拍攝位置：陸側橋頭、高處展望台和商業設施旁，看見的並不是同一個角度。官方資料記載，大橋全長三千五百四十公尺，二○一五年一月開通；它足夠長，換一個岸邊位置，橋墩和海岸的前後關係就會改變。但原資料只寫「伊良部大橋展望」，沒有能辨認的設施全名，舊文還把高處平台和小型橋頭混在一起。觀光協會另外列有具名的「いらぶ大橋海の駅」，也不能因為都看得到橋，就把兩者直接畫上等號。這一項暫時不導航；等你選好另行驗證的公共觀景點，再比較橋身和岸線如何交會。拍照留在合法開放範圍，橋上不要臨停。
  observationPrompt: "使用已另行驗證的公共觀景點時，橋身在畫面中是接近水平還是向遠處彎去？不要依未具名照片尋找私人平台。"
