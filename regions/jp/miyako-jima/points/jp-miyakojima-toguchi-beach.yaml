  title: "渡口の浜"
  summary: "伊良部島南側約八百公尺的弓形白沙灘，從岸上辨認來間島與宮古島；海灘pin不是入水安全保證。"
  narration: |-
    沿著沙灘望過去，渡口之濱不是直直的一條白線，而是緩緩彎成弓形；先看這個弧度，比急著走向水裡更容易讀懂海灣。沖繩觀光局記載，這段細白沙灘約有八百公尺，位於伊良部島；宮古島觀光協會則提醒，從正面海景能望見宮古島與來間島。把地圖暫時收起來，試著找出遠處島影與近岸沙線的不同方向，就能感覺這幾座島並不是各自孤立，而是共享同一片海面的鄰居。這裡的故事不需要加上幾千萬年的巨岩傳奇，眼前灣形和島影已經足夠清楚。細沙看來柔和，海況卻不一定如此；觀光協會特別提醒南風時會起浪，也可能有水母隨風而來。請沿開放岸段散步，依現場告示決定停留範圍，不因水色漂亮就判定適合下水。
  observationPrompt: "從開放岸段看沙灘的弧形，並比較遠處來間島、宮古島方向的島影；不用下水或攀礁。"
