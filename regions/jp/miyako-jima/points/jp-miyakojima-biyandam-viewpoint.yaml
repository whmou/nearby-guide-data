  narration: |
    這個名稱目前先不要當成可以直接前往的景點。原稿把「ビャクダン山展望台」寫成宮古島最高處，還附上高度與環島視野，但本次沒有找到足以支持這些說法的官方地點資料。實際查詢 Google Maps，也出現多個其他名稱的展望台，不能因為都能看海，就挑一個座標放進來。市府確實有野原岳的文化資產介紹，可是沒有證據證明它就是這個名字的地方。這筆因此保留為待辨識條目：若手上有日文路牌照片、原始遊記或地址，可以用來釐清名稱；在那之前，不推薦沿著舊座標找入口，也不把別座山的歷史接到這裡。旅途中一個誠實的空白，比把人帶到不相干的地點更有用。
  observationPrompt: "若有原始日文路牌、地址或出處，先用它確認地名；不要按舊座標找山路，也不把其他展望台認作此處。"
