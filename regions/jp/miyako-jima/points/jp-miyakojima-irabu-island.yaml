  title: "伊良部島"
  summary: "宮古群島第二大島，2015年大橋通車後可從宮古島走陸路抵達；坡上的佐良浜聚落與不同海岸，是認識全島的兩條線索。"
  narration: |
    看伊良部島的地圖時，別急著只圈出海灘，也看看佐良浜那一片沿著坡地密集排列的房子。沖繩官方旅遊資料說，這裡是宮古群島第二大島；二○一五年一月大橋開通後，從宮古島前來更方便，但島上的故事不只是一段過橋風景。佐良浜的屋舍沿坡而建，和渡口之浜開展的沙岸，是同一座島很不一樣的面孔。觀光協會的文化地圖還記下，過去北側聚落偏重漁業、南側偏重農業，人們曾以各自的物產交換生活所需。下次看見港邊和田間的道路，可以想想：一座島的日常，如何把海上與土地上的工作接在一起？這是一份全島導覽，不是一個入口；請挑選另行驗證的公共景點停留，住宅巷道裡放輕腳步，不把居民院落當成觀景場地。
  observationPrompt: "在地圖上比較佐良浜聚落與渡口之浜的位置；實際停留時，留意公共道路旁屋舍和海岸的排列，不窺看私人院落。"
