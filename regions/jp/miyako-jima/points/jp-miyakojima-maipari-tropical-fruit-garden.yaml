  title: "Maipari宮古島熱帶果樹園"
  summary: "在前濱旁的果樹園，沿步行或導覽車路線觀察鳳梨、香蕉與棕櫚的不同模樣。"
  narration: "先找找鳳梨長在哪裡，再把目光抬向香蕉與棕櫚，同樣是熱帶植物，長成的模樣卻很不一樣。園方說，Maipari這個名字指的是前濱旁的田地；走進這裡，海灘度假的畫面便換成了果園與耕作的日常。官方介紹列出多種鳳梨，包含Gold Barrel，也有不同品種的香蕉，觀察時可以比較葉子排列和植株外形，不必急著只找成熟果實。園內有散步路線，也提供工作人員帶領的導覽車行程，其中安排宮古馬互動；是否能參加、如何餵食，都先聽現場人員說明。九月來訪不代表每一種水果都正在結果，想體驗採收也要事先詢問；慢慢看植物怎麼長，把熟悉的水果和它在田裡的樣子接起來，就很有收穫。"
  observationPrompt: "沿開放路線找找鳳梨、香蕉與棕櫚，葉子和植株外形各有什麼差異？"
