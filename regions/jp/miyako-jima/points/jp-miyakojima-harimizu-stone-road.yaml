  title: "漲水石疊道"
  summary: "港口舊街裡留下的石鋪道路，連著震災後整備與城市變遷。"
  narration: "腳下這段石路，曾經比現在長得多：漲水石疊道原本沿著舊政廳「藏元」南側，從漲水御嶽前一路接到祥雲寺東北側的路口，把港邊的重要場所串在一起。宮古島市的解說推測，1696年大地震之後，人們在十八世紀初的土木整備中把道路拓寬，並利用石材鋪路；這是根據地方史料作出的解釋。後來築港、神社遷移、戰爭和道路施工接連改變街景，官方記錄說，如今大約只剩原來的三分之一。低頭看看石塊的大小和接縫，再抬頭對照周圍的現代街道，便能感覺這不是一條為觀光另外造出的古風小巷，而是老城市留下的一小段骨架。走過去的幾步路，剛好跨過了不同年代的平良。"
  observationPrompt: "比較石鋪路與周圍現代道路的交界，想想原本更長的道路如何連接港邊公共場所。"
