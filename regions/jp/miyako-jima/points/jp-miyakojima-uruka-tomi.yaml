  kind: "attraction"
  title: "砂川遠見番所遺跡"
  summary: "上比屋山南端的石砌海上監視台，留下以烽火傳遞消息的歷史。"
  narration: "低低的方形石台，曾經做的是把遠方船隻的消息送到陸地上。砂川遠見位在上比屋山南端，是先島諸島火番盛的一處遺跡；官方介紹把這套監視、通報制度的設置追溯到一六四四年，當時沒有電話，烽火就是跨越距離的訊息工具。眼前的石台由琉球石灰岩切石砌成，東西約七公尺、南北約四點五公尺，北側設有出入口階梯。讀這些尺寸時，可以想想看，海面那麼寬，值守者工作的地方其實不大；看海在這裡曾是職責，不只是休閒。請沿現場開放的文化財動線觀察石台輪廓與朝向，不攀上石牆，也不要為了找更好的角度穿越周邊祭場；若有祭祀或管制，就在外側停下。"
  observationPrompt: "石台北側的入口與方形切石輪廓，在開放動線上能辨認到哪些部分？"
