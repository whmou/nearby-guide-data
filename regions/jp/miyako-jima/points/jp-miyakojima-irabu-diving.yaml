  title: "伊良部島ダイビング"
  summary: "伊良部、下地島周邊的潛水主題，特色在拱門、洞穴與光影；各潛點有不同深度和能力要求，不能共用一個陸上圖釘。"
  narration: |
    翻開潛點介紹，先找找照片裡的拱門：海底的岩石，不只是魚游過的背景，也能成為閱讀這片海的主角。沖繩官方旅遊資料把伊良部島的「Ｗアーチ」介紹為兩座相連的拱門，換一個觀看角度，其中一座會顯出心形輪廓；同一份資料卻把「魔王の宮殿」列在下地島，並標示中級以上的船潛。這個差別很重要：伊良部潛水不是一條人人都能參加的固定路線，更不是跳進兩島水道就能開始的漂流。行前可以請業者用實際潛點照片說明，先認識岩壁、洞口和光線的關係，再確認自己的經驗適不適合。海況會改變行程，也沒有保證出現的海龜或固定能見度；這份介紹只陪你理解地景，真正的集合地點、器材和活動安排，都要由預約的合格業者確認。
  observationPrompt: "行前看具名潛點的照片：拱門、洞口和開放水域在哪裡？向業者確認實際安排的潛點與適用經驗。"
