  title: "下地島洞窟ダイビング（通り池・海中活動）"
  summary: "通り池的水面下連向另一座池與外海，構成特殊洞穴地形；這是進階海中活動的故事，不是可自行步行抵達的入水口。"
  narration: "如果從通り池開放的陸上觀景處看過兩個水面，可以先記住它們隔著岩地並排的樣子；真正有意思的連結，藏在看不見的水下。官方介紹說，兩池在水面下相通，並連向外海，這也是「通り池」名稱所指的特徵，並不是兩個完全封閉的淡水水坑。海水深度不同，鹽分與水溫條件也有差異，讓一張平面的池面照片，背後其實有立體的地下構造。正因為海中路線要穿過黑暗隧道，官方把這裡列為相當進階的潛點；美麗的地形不等於容易的活動，更不等於沿岸找個洞就可以進去。這筆導覽只保留洞穴與海洋相連的故事，沒有固定集合GPS。一般遊客留在開放步道欣賞即可，潛水資格、裝備、路線及當日海況，都須由所訂專業業者評估，別把岸上可看的池當成可自由下水的入口。\n"
  observationPrompt: "若在通り池開放觀景處，從安全位置比較兩池形狀、水色與周圍岩地；不離開步道、不靠近洞口或下水。"
