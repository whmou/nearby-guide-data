  id: jp-miyakojima-shimoji-cave-dive
  parentId: jp-miyakojima-shimoji-island
  kind: venue
  title: "下地島洞窟ダイビング入口"
  summary: "下地島的通り池與外海透過水下洞穴相連，是特殊的地形潛水景觀；洞穴潛水屬進階活動，本導覽不提供可步行抵達的入水點或自行穿越路線。"
  narration: |
    下地島通り池的兩個內陸水池在水下相連，並透過洞穴連通外海。這套隱藏於石灰岩中的連通構造，是通り池地形景觀的重要特色。從岸上觀看池水，可以想像眼前平靜的水面與外海之間，還有肉眼看不到的地下聯繫。官方觀光資料將需要穿越黑暗水下隧道的通り池潛水列為進階潛點，不能視為初學者體驗方案。本導覽沒有核實可供遊客自行抵達的洞口或入水路線；陸上遊客請留在通り池開放步道與觀景處，潛水安排應由所訂專業業者評估資格、海況與集合方式，勿自行前往礁盤尋找入口。
  observationPrompt: "若從通り池開放的岸上觀景處欣賞池水，試著比較兩池的水色與波紋；請留在開放範圍，不要為尋找海中洞口而離開步道或下水。"
