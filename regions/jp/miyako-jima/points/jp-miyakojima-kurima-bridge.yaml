  title: "来間大橋"
  summary: "1995年3月通車、全長1,690公尺的農道橋，連接宮古島與来間島；定位採来間島側陸上橋頭。"
  narration: |
    從来間島這一端回望，長橋把眼前的小島和對岸的宮古島接成了一條線；再找找海邊那道白色砂帶，就是前浜方向的風景。来間大橋全長一千六百九十公尺，於一九九五年三月開通，觀光協會特別提到它的身分是農道橋。這個名字提醒我們，橋不只是旅途中的漂亮畫面，也和一座耕作地占了大半的小島有關。看風景時，可以把橋當成尺：近處的橋面、海上的橋墩、對岸的沙灘，原本分散的景物就有了遠近關係。這裡採用的是官方来間島側橋頭圖釘，並不表示橋上有可供臨停的位置；想慢慢看，請先在合法停車處停妥，再依公共通道及現場標示活動，不要在行車中分心拍照。
  observationPrompt: "從陸側公共位置看，橋身和對岸前浜白沙帶形成什麼角度？請勿在橋上停車觀察。"
