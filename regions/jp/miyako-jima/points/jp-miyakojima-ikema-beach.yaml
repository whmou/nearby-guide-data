  summary: "「池間島ビーチ」泛稱不足以區分島上多處海灘；保留待確認名稱與入口，不選任意沙灘來補GPS。"
  narration: |
    如果行程上只寫著「池間島海灘」，出發前還差一個重要步驟：確認是哪一片海。實際 Google Maps 查詢會列出フナクス、イキヅー、オハマ等不同名稱的海灘，並不是同一處入口的不同翻譯。原稿沒有足夠資料讓我們在它們之中作選擇，所以這筆先不提供導航，也不把原來靠近某片沙灘的座標當成證明。市府談到宮古海岸時也提醒，自然海岸不能一概視為設施完善的海水浴場，潮流與危險生物都需要留意。等地名、合法入口與當天海況確認後，再決定適合在岸上觀察，還是參加有管理的活動。此刻可以先把期待留給海岸，而不是預約一隻一定出現的海龜；不踩珊瑚、不越過私人地界，也不為了一個模糊名字走向未知的礁岸。
  observationPrompt: "先取得明確日文海灘名與合法入口，再比對地圖；勿根據泛稱、舊座標或海龜照片自行尋找下水點。"
