  title: "友利御嶽"
  summary: "同名「友利御嶽」的可查實體在鳩間島；宮古島這筆尚未辨識，不挪用另一座島或友利其他御嶽的故事。"
  narration: |-
    先讀地圖上的地址，再讀景點名稱，這裡特別值得多花幾秒鐘。「友利御嶽」不是只靠四個字就能認定的地點：日本歷史地名資料庫把這個同名場所列在竹富町的鳩間島，石垣市的歷史照片也註明，那裡曾有雨乞祈願的紀錄。這些都是鳩間的材料，不能搬到宮古島來講成眼前的聖林。另一方面，宮古島地方名錄在城辺友利列的是嶺間御嶽，也不能因為同在友利便當作別名。原資料描述的石壇、福木與儀式，目前都缺乏與這筆身分相連的證據，因此先收起導航，只保留這個辨名提醒。若你在村落公共道路上看見名牌，可以先核對正式名稱與告示；沒有獲准，不走入林地找祭壇，也不把居民的祭祀當作等候拍照的表演。
  observationPrompt: "僅從公共道路核對可見名牌與場所地址；在正式名稱未釐清前，不進入林地或接近祭祀。"
