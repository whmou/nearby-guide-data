  title: "Shigira海灘（シギラビーチ）"
  summary: "在珊瑚礁環繞的白沙海岸看海，理解海洋生物與度假設施共用的空間。"
  narration: "先從岸上看白沙、淺水和遠處海面，Shigira海灘不只是飯店旁的一張藍色背景。沖繩觀光資料把這裡介紹為珊瑚礁環繞的白沙海岸，海中有珊瑚與熱帶魚；偶爾也可能出現海龜，但牠們不是每天按時上班的演員，這次沒遇見也很正常。沙灘旁的Beach House提供器材租用、更衣與沖洗等服務，讓原本的海岸多了一層人們安排休假的生活場景。看海時可以留意自然岸線和人工設施怎麼相接，也看看現場對遊泳區域與時間的說明。這些規則會隨天候、海況調整，不是看到別人下水就能照做。岸上停留同樣能享受這一站；停車及非住客使用設施另有費用，先問清楚，不把海灘、泳池與飯店專用區當成同一個免費空間。"
  observationPrompt: "從岸上觀察白沙、淺水與人工設施的界線，現場哪些標示區分公共海岸、活動區與專用設施？"
