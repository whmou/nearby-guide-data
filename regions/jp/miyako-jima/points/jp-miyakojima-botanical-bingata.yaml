  locationHint: "紅型工藝主題，尚未確認宮古島具名體驗工房；不是可抵達的室內場館定位，請先另行核對工房名稱與地址。"
  summary: "紅型型染的工藝主題，從防染糊、豆汁與漸層上色認識布面；尚未指定宮古島某一間體驗工房。"
  narration: |
    看一塊紅型布時，可以先找圖案邊緣那些沒有被顏色吃掉的細線。它們不只是畫得仔細，也和「先擋住顏色」的工序有關。藤崎紅型工房公開的型染流程說明，工匠把型紙放在布上，塗上米糠與糯米調製的防染糊；糊不是豬油，也不是最後留在作品上的顏料。接著，豆汁處理幫助顏料定著、減少暈開，再一層層上色。日文叫「隈取」的漸層，則讓平面的花葉多出表情。蒸過定色、洗去糊之後，先前被遮住的部分才清楚顯現。下次看到成品，可以比較同一片葉子的深淺和輪廓，想一想哪些地方靠筆刷，哪些地方靠事前留白。這裡介紹的是工藝，不是已核實的宮古島店家；若想親手體驗，仍要另找具名工房確認課程，不預設當天能完成全部流程或立刻帶走作品。
  observationPrompt: "觀看紅型成品或另行確認的體驗示範時，比較輪廓留白與隈取漸層；這筆不提供未具名工房的導航。"
