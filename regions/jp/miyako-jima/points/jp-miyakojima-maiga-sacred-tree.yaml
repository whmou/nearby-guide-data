  title: "前井與神木（外側觀看）"
  summary: "在老樹旁認識等待取水時紡苧麻的日常，以及洞泉改成直井的變化。"
  narration: "看見大樹伸展在井旁，很容易只注意樹形；但前井最動人的故事，是等水的時間怎麼被用起來。這口井曾供應下里添西部與長間南部居民飲水，原來是洞泉，取水辛苦又有衛生問題，一九一九年九月改成垂直的井。官方記錄，因為出水量不大，居民得輪流等候，於是趁空檔處理、紡接苧麻，井也有了與苧麻工作相關的別名。家裡要用的水、手上要完成的線，原來會在同一個地方交會。至於遮覆井邊的神木，資料描述為老榕類樹木與另一株樹合生的樣子，值得從外側慢慢看枝幹的走向。請留在公共可站立處，不靠井緣、不碰供物、不採枝葉，讓居民與老樹都保有自己的空間。"
  observationPrompt: "從公開外側看，神木的枝幹如何伸展到井的周圍？"
