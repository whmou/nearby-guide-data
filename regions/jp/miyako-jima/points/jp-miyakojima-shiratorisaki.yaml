  kind: "attraction"
  title: "白鳥崎公園（白鳥崎岩礁海岸）"
  summary: "從白鳥崎公園的開放步道，閱讀伊良部島西北的岩礁海岸；導航錨點是公園，不是標示閉業的舊岬角地標。"
  narration: |-
    先看海岸的輪廓：這裡吸引人的不是一座白色燈塔，而是岩壁、礁帶與海面彼此交接的線條。市教育委員會介紹，白鳥崎面向東海，外側有稱為白鳥干瀨的弧形岸礁；岩岸長期受到風化與侵蝕，讓原本藏在地下的不同地層有機會露出。把視線拉回腳邊的開放步道，可以試著比較岩石表面的凹凸、裂隙，以及植物選擇生長的位置，不必走到崖邊才看得懂這段地質故事。觀光協會把從フナウサギバナタ延伸到白鳥崎的一帶介紹為有步道和休憩處的西海岸公園。這次定位選的是白鳥崎公園，另有一枚同名岬角地標在地圖上標為閉業；請以現場告示為準，不往那個舊點探路，也不要離開步道踏上岩礁。海風強或有封閉標示時，留在安全範圍看海就好。
  observationPrompt: "在公園開放步道上，找找岩壁裂隙、低矮植物與外側礁帶的形狀；不越欄、不朝閉業岬角探路。"
