  title: "来間島龍宮城展望台"
  summary: "来間島高地上的三層觀景塔，以龍宮城為造型；看對岸前浜、来間大橋與海底砂地、珊瑚礁造成的色彩層次。"
  narration: |
    先抬頭看橘色屋頂，再循著開放的階梯往上走：這座帶著童話味道的小塔，是来間島的龍宮城展望台。它不是古代宮殿遺址，而是以龍宮城形象設計的三層觀景建築；站在海側，對岸的前浜白沙、跨海的来間大橋，便有了可以一起觀看的角度。眼前海水為什麼不是同一種藍？觀光協會的介紹把線索放在海底：砂地與珊瑚礁的分布，共同織出不同深淺的色塊。可以先找最淺的一片，再看看它和白沙岸線是否相連，接著回頭望向島內，把海岸和小島生活放在同一幅風景裡。今天看得到多遠，仍取決於天候；階梯濕滑或風大時別勉強登高，也不要為了取景探出護欄。
  observationPrompt: "在開放平台內找找：前浜的白色砂帶、来間大橋，以及海面深淺色塊，彼此怎樣排列？"
