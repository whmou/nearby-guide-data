  title: "来間島"
  summary: "以大橋連接宮古島的小島，東側聚落之外多為耕作地；從島內田地到西岸沙灘，可看出小島土地使用的不同層次。"
  narration: |
    在来間島的地圖上，先找東側聚在一起的房屋，再看看周圍大片沒有密集街巷的土地。沖繩官方旅遊資料介紹，島上聚落集中在東側，其餘大部分是耕作地；跨過来間大橋，你到訪的因此不只是一片海景，也是一座有人生活、持續耕作的小島。往海邊看，西岸有長間浜，東側高地則有龍宮城展望台，可以望向對岸前浜與来間大橋。同樣的海，從不同岸邊看，會和沙灘、橋梁排成不一樣的畫面。規劃停留時，可以先選一處已確認的公共觀景點，再用島圖理解它和聚落的位置關係，不需要把每條小路都走遍。田埂不是觀光步道，居民門前也不是停車位；把空間留給農作和生活，才有機會看懂這座小島的節奏。
  observationPrompt: "在島圖上找出東側聚落、西岸長間浜和来間大橋；它們之間有哪些耕作地，哪些是可公開抵達的地點？"
