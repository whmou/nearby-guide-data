  locationHint: "官方觀光頁的東平安名崎岬端觀景定位，非停車場或燈塔售票入口；由合法停車處循整備步道前往，勿越過護欄或接近海蝕崖，強風或封閉時不前進。"
  summary: "約兩公里長的石灰岩岬角；貼地生長的植物與海蝕崖，讓東平安名崎不只是一座燈塔的背景。"
  narration: |
    走在東平安名崎的開放步道上，不妨先把目光從燈塔放低。這裡的植物為什麼常常貼著地面，而不是長成一排高樹？文化資產解說指出，岬角長年受強風影響，形成了風衝地的植物群落。像テンノウメ，就以堅硬、貼著石灰岩延伸的莖適應海風；不起眼的低矮姿態，其實是一種生存辦法。再把視線放遠，約兩公里長的岬角伸向海面，琉球石灰岩、海蝕崖與低位海階，構成它的骨架。燈塔只是這幅景觀裡比較醒目的標記，岩石與植物才把更長的時間留在眼前。九月來訪，不必追著春季花海的照片找相同畫面，也不能保證當天無風晴朗。留在整備步道內，比較腳邊低矮植被與遠處崖線；看得慢一點，就能發現這片看似空曠的地方，其實一直在回應海與風。
  observationPrompt: "留在步道內比較低矮植被、裸露石灰岩和遠處崖線，不為辨認植物跨越圍欄或靠近崖緣。"
