  locationHint: "官方觀光頁標示的宮古本島側橋頭觀景定位，不是橋中央或池間島側商店。先合法停車，再到允許停留的陸側範圍觀察；勿為觸發定位在橋上車道停車。"
  summary: "1992年2月通車、全長1425公尺的池間大橋；從本島側安全觀景區看見島嶼之間的日常連結。"
  narration: |
    先看看橋的線條怎麼跨過海面，接上另一座島。池間大橋全長一千四百二十五公尺，在一九九二年二月通車，把宮古本島與池間島以道路連在一起。對旅行者來說，這可能是相機裡的一條漂亮弧線；換個角度想，它同時也是人們往來兩島的路。官方觀光介紹除了海景，還列出停車場所，以及池間島側的商店、休憩空間。這些看起來平常的小設施，提醒我們橋不是孤立在海上的展示品，而是接在有人生活的地方。你可以在本島側允許停留的觀景區，順著橋的方向看過去，找出橋、岸線和水面之間的層次；海色會隨光線與天候改變，不必追求和照片一模一樣的藍。也別為了把橋拍得更正而在車道停下來。讓車輛繼續通行，自己站穩在安全範圍，才能把風景和日常交通一起看進去。
  observationPrompt: "在本島側安全停留區順著橋身觀察兩端岸線與水面層次，不在橋上車道停車拍照。"
