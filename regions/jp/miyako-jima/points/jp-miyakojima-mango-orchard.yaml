  title: "宮古マンゴー農園"
  summary: "宮古芒果栽培主題，尚無具名可參觀果園；從品種、產地標示和栽培研究認識果實，九月下旬不保證能採果。"
  narration: |
    在水果攤前看到紅色芒果，先找找標籤上的品種和產地，別只用顏色猜它從哪裡來。沖繩縣宮古島支所的農業研究資料指出，當地主要栽培的愛文品種，紅色果皮是商品特色；研究人員也關心果皮出現斑駁的問題，並把高濕度、果面結露列為要處理的栽培條件。原來一顆漂亮的芒果，背後不只是陽光，還有許多看不見的管理功夫。ＪＡ沖繩資料另外介紹了愛文與凱特等品種，挑選時可以問清楚名稱、產地和適合食用的時間，不必把所有芒果都當成同一款。這裡目前只是農業主題，不是一座已確認開放的果園；九月下旬能否買到當季鮮果、是否有參觀或採果，都要由具名農家另行確認，不能拿一張產季表就當作入園邀請。
  observationPrompt: "在營業販售場所讀品種與產地標籤，詢問保存及食用方式；不要以果皮顏色推定甜度、成熟度或一定產自宮古島。"
