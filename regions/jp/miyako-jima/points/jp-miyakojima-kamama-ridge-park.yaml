  title: "カママ嶺公園"
  summary: "1976年由蒲間嶺丘陵整備而成的市民公園；大型風獅爺遊具之外，歌碑與文學碑讓散步多了一層地方記憶。"
  narration: |
    公園裡那隻大大的風獅爺，第一眼像是在守著山丘，走近才發現它也是孩子的溜滑梯。カママ嶺公園不只有遊具；宮古島市的導覽冊記載，這片原本林木茂密、叫作蒲間嶺的丘陵，在一九七六年成為公園，之後一直是市民休憩的地方。沿著開放步道慢慢找，你會遇到一座座石碑，其中有曾在宮古高中任教的俳人篠原鳳作句碑，也有記錄地方歌謠的「とうがにあやぐ」歌碑。把它們當成散落在戶外的書頁，不必讀懂每個字，也能先看看刻的是詩句、歌名，還是紀念日期。從大風獅爺走到小小的刻字，這個公園就不只是看海的高處，也是一個居民把文學、歌聲和日常放在一起的地方；遇到孩子玩耍，請把遊具空間留給他們。
  observationPrompt: "沿公共步道找一座歌碑或句碑：刻字是短短幾行，還是較長的文字？能找到作者姓名或建立年份嗎？"
