  title: "砂川御嶽"
  summary: "砂川地區有不同御嶽與祭祀歸屬；本筆尚未查明正式名稱，不把砂川神社或其他御嶽視作同一地點。"
  narration: |-
    如果村路旁出現一片樹林或石圍，先別急著把它當作可以參觀的御嶽入口。砂川的信仰生活，比地圖上一個名稱複雜得多：二〇一三年刊出的田野報告，記錄居民如何與各自所屬御嶽、稱為マウガン的守護神連結，也談到家中的香爐與命名儀禮。這些記錄讓我們看見，御嶽不只是林子裡的一座祭壇，還牽連家庭與個人的生命歷程。不過，報告不是一份今日參觀指南，也不能證明舊資料所寫的「砂川御嶽」究竟是哪一處；地方名錄與實際地圖還列出砂川神社等不同場所。身分確認之前，不把任何一座的祭神、樹種或歷史套過來。若在公共道路看到場所名牌，先讀名字與限制，尊重居民，不跨過圍界去找祭壇或供品。
  observationPrompt: "只在公共道路可見處確認場所名牌與限制標示；不要為辨識地點走入林地、靠近祭壇或拍攝儀式。"
