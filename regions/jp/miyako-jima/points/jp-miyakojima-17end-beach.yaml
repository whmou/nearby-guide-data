  locationHint: "沖繩官方旅遊頁的17END岸側觀景定位，非停車場、跑道入口或保證可下水的沙灘入口。一般車輛禁止駛入機場管理通路，依現場標示步行；潮位與臨時管制可能限制停留。"
  summary: "下地島跑道端部的海岸步行景觀；白沙露出隨潮位變化，17END的名字來自跑道編號，不是每天都有的飛行表演。"
  narration: |
    來到這裡，可以先找兩種線條：機場邊界筆直、規整，海岸的白沙邊緣卻會隨潮位改變。17END聽起來像某個神祕景點代號，其實官方航空相關介紹說，名字結合了跑道識別號十七，以及英文的跑道末端。這個看似為拍照而生的地方，首先是一座仍在使用的機場旁邊。沖繩官方旅遊資料也提醒，低潮時才會露出那片常見於照片中的白沙；抵達時看見多少沙，不能拿別人的照片當保證。至於從頭頂掠過的訓練機，更不是固定安排的表演。慢慢走在允許通行的管理道路，看看直線的人工設施和彎曲的潮水邊界如何相鄰，已經很有意思。一般車輛不能開進這段路，路面也可能有沙和高差；請讓觀察留在安全範圍，不為一張照片靠近跑道設施或追逐飛機。
  observationPrompt: "從允許通行的道路觀察機場直線邊界與海岸曲線；比較眼前露出的沙灘範圍，不預設一定能看到飛機。"
