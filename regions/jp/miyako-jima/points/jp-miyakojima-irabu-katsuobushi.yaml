  title: "佐良浜かつお節文化"
  summary: "佐良浜的鰹魚漁業與加工文化：地方文化地圖將鰹魚漁業起點記為1909年，今日產業介紹則說明當日往返的一本釣。"
  narration: |
    如果在店裡看見「かつお節」和「なまり節」，先停一下，讀讀包裝上的名字：同樣從鰹魚出發，地方文化地圖卻把它們列成不同的加工品，而不是一概叫作柴魚片。佐良浜的鰹魚漁業也不是一句「傳承數百年」就能說清；觀光協會資料記載，它從明治四十二年，也就是一九○九年開始，大正時期發展興盛，昭和時代還留下前往南方海域作業的歷史。今天的產業介紹則說到當日往返的一本釣，提醒我們漁村生活一直在改變，不必把過去遠航的畫面套在每一艘船上。選購時不妨看看加工品名稱、產地與保存方式，讓餐桌和港口有一條看得見的連結。這裡講的是文化，不是已開放的工廠行程；想參觀製作，請先取得具名業者同意，也別走進作業區等候拍照。
  observationPrompt: "在正常營業的販售場所讀包裝：寫的是かつお節、なまり節還是其他加工品？產地與保存方式有何不同？"
