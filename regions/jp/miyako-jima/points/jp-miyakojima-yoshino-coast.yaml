  title: "吉野海岸"
  summary: "約五百公尺白沙灘旁就是珊瑚礁，近岸生態值得細看；海況受潮汐影響，不保證海龜或適合自行浮潛。"
  narration: |-
    站在岸上，先看看海面顏色和明暗的變化，別急著把每一塊深色都認成珊瑚，也別只為了找海龜而來。沖繩觀光局介紹，吉野海岸約有五百公尺白沙灘，珊瑚礁靠近岸邊，包含硬珊瑚與軟珊瑚；這也是它成為浮潛景點的重要原因。相較於只追求遠方的一整片藍，這裡讓人有機會留意近岸不同生命形態，但是否能清楚看見，仍取決於光線、海況與當天安排。觀光協會同時提醒海灘受潮汐影響，並列有收費停車場，所以「自然海岸」不等於所有服務免費，更不等於不用準備就可以下水。今天可以先在開放岸段看灣岸與水色，再向合適業者了解活動條件；不踩珊瑚、不追逐動物，也不把任何海龜照片當成牠們每天必來報到的承諾。
  observationPrompt: "從岸上比較沙灘與不同明暗水面的分布；若參加合適的導覽活動，再依解說辨認珊瑚，不追逐或觸碰動物。"
