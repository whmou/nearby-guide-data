  title: "下地島空港"
  summary: "下地島航廈以木質屋頂、深屋簷與自然通風回應海島氣候；從候機場所讀懂訓練機場轉向旅客門戶的變化。"
  narration: "抬頭看看航廈的屋頂，再留意屋簷如何伸向室外；下地島空港值得看的，不只有飛機，也有建築怎麼和海島的陽光相處。營運方的二〇一九年竣工資料介紹，屋頂採用直交集成板，也就是把木板方向交錯、層層黏合成的大型構材；木頭在這裡不只是裝飾，而是結構的一部分。深屋簷用來遮陽，大開口則配合自然通風，都是當時降低建築能源負荷的設計，而不是保證全年不用冷氣。這座航廈在二〇一九年三月完成，讓原本以飛行員訓練聞名的機場增加一般旅客服務，交通與建築的角色一起改變。等車或辦理手續時，可以從公共區域比較屋頂、陰影與出入口的關係；有些候機與水庭空間位在管制區內，沒有搭機也不必硬找入口，公共區同樣能讀到設計。\n"
  observationPrompt: "在航廈開放公共區觀察木質屋頂、深屋簷和開口；陰影落在哪裡？不要為拍攝機坪或水庭越過管制線。"
