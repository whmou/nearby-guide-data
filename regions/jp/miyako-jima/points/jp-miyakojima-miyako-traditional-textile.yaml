  title: "宮古上布（宮古島市伝統工芸品センター）"
  summary: "在上野的傳統工藝品中心，從細緻苧麻線、絣紋與砧打光澤，讀懂宮古上布的手工時間。"
  narration: "先別急著把深色布料看成普通藍布，靠近展示允許的位置，看看細線之間的紋樣，再換個角度留意表面光澤；宮古上布的工夫，常常就藏在這些不張揚的小地方。工藝中心介紹，原料是苧麻，纖維經手工績成細線、染色與織造，最後還要砧打，才形成像上了蠟般的光澤，不是把布放在珊瑚石上「砑染」就完成。這門技藝在一九七八年獲國家重要無形文化財指定，二〇〇三年另受保護的是績線技術，兩個年份說的是不同層次的保存工作。館內展示製作素材、工具與流程，試著把一件成品倒著想回一根植物纖維，就比較能理解時間花在哪裡。這裡是上野野原的現址，並非舊中心；織手養成室的作業參觀另有休息日，沒看見織工工作，也不表示那些細緻步驟不存在。\n"
  observationPrompt: "在允許觀賞的展示前，找找苧麻原料、製作工具與成品紋樣；換個角度比較布面光澤，未經同意不要觸摸。"
