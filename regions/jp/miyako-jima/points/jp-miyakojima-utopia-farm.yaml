  kind: "venue"
  title: "Utopia Farm宮古島觀光農園"
  summary: "從九重葛的栽培造型與熱帶果樹，看看一家農場如何把生產變成可參觀的日常。"
  narration: "先看看枝條被怎麼安排，再看花色，這裡最有意思的不只是「花很多」。Utopia Farm的官方介紹說，園內栽培約五十種九重葛，還有不同品種的扶桑，以及芒果、木瓜、香蕉等熱帶果樹；相同植物，換一種支架或修整方式，就可能形成不一樣的景觀。這座觀光農園在二〇〇一年開園，創辦者希望把農業的樂趣分享給更多人，於是原本偏向生產的工作，也成了旅客能慢慢理解的風景。請沿見學路線比較葉形、枝條和栽培方式，不伸手採果。官方把芒果收穫期列在六月到八月，九月底別預約想像中的滿樹鮮果；有什麼花、什麼果實，以現場為準。離開前若想吃點甜的，還可以看看附設果物咖啡的當日品項。"
  observationPrompt: "沿見學路線比較九重葛的枝條支撐與不同果樹葉形，哪些部分能看出人工栽培管理？"
