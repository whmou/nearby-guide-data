  kind: "attraction"
  title: "八重干瀬（ヤビジ）"
  summary: "池間島北方的廣域珊瑚礁群，也是島民熟悉的漁場；故事保留，導航須另外確認實際船家與登船處。"
  narration: |-
    如果已在合法安排的船上，不妨先看海面那些深淺不同的色塊：八重干瀨不是一整塊等著人上岸的小島，而是由多片珊瑚礁構成的海域。池間漁協的介紹提醒我們，這裡長久以來也是支撐居民生活的漁場；對漁人來說，辨認礁的位置與潮水，不只是欣賞景色。名字也留下地方差異：市教育委員會的資料記載，池間、島尻與狩俣的叫法不盡相同，一九九九年平良市決定採用池間慣用的「やびじ」讀音。至於「八重」是八個干瀨，還是層層重疊的意思，仍有不同說法，不能當成定論。看海時可以比較遠近水色和礁帶輪廓，但不承諾某天一定露礁，也不為了拍照踩上珊瑚。這是廣域海上導覽，集合地點請跟你的船家確認，不朝礁群中心自行導航。
  observationPrompt: "若已參加合適的海上行程，從船家允許的位置比較不同水色與礁帶輪廓；不踩踏、採集珊瑚或自行離隊。"
