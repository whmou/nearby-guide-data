  locationHint: "多良川官方連結的本社地址錨點，城辺砂川85；參觀先至賣店報到並確認預約，不是南方約150公尺的洞窟貯藏庫入口。不可自行進入生產區；駕駛勿飲酒。"
  summary: "在多良川本社認識泡盛與洞窟貯藏：木牌記下的紀念日，使熟成時間成為看得見的生活記憶。"
  narration: |
    如果參加多良川安排的貯藏庫見學，不妨留意酒瓶旁的木牌。那些名字與紀念日，讓泡盛不只是一排商品，也像替生日、新居或人生轉折留下一個慢慢等待的位置。業者介紹，洞窟裡的溫度與濕度相對穩定，適合古酒熟成；參觀者看到的等待，其實也有環境條件在支持。這裡要分清楚兩個地方：先到城辺砂川的本社賣店報到，洞窟貯藏庫則在酒廠南方約一百五十公尺，不能把地圖上的公司圖釘當成可以自行鑽入的洞口。官方目前介紹的內容是製酒影片和洞窟貯藏庫，不等於能走進每一道發酵、蒸餾工序旁邊。見學以預約者優先，出發前確認安排。到時可以看看瓶子與木牌如何一起保存時間；若負責開車，就把品飲留給別人，照樣能從這些物件理解一瓶酒與人的日子怎麼連在一起。
  observationPrompt: "在業者允許的見學範圍觀察酒瓶與紀念木牌；分辨本社報到處和洞窟貯藏庫，不自行進入作業區。"
