  title: "長間浜"
  summary: "来間島西岸約一公里的自然沙灘，以西向海景著稱；官方岸邊地標非停車場，適合把岸上觀察列為主要活動。"
  narration: |
    先看沙灘往兩旁延伸的線條，再把目光移到海天交界；長間浜的開闊，不需要靠一座觀景塔來襯托。它在来間島西岸，觀光協會記載砂浜延伸約一公里，西向的海面也讓這裡以夕景聞名，不過落日能不能露臉，還是要看當天雲況。和聚落之間隔著植物群落，是縣觀光資料特別提到的地形細節，因此別把每一條穿過植被的小徑都當成入口。走在既有公共通道和岸上，看看白沙、岸邊植物與海浪留下的濕沙線，海灘的輪廓就清楚了。這裡官方列為沒有停車場、廁所、淋浴和商店，西風也可能帶起浪；帶好飲水、別擋住道路，把這次停留當成看海，而不是一張保證可以下水的邀請。
  observationPrompt: "留在岸上，看看乾沙、濕沙和植被交界是否平行；今天的浪線距離植物帶有多遠？"
