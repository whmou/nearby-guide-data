  notes:
    - "逐頁重新擷取官方／第一手資料，改寫繁體中文口語導覽、摘要與觀察提示；故事 claim 對應本檔 sources。"
    - "重新抓取市府文化財與參觀頁後，確認宮古馬是馬種而非唯一場所；原伊良部牧場無名稱可辨識。主線 Maps 搜尋落到平良狩俣且標示閉業的「宮古馬牧場」，與市府城辺字長間1891-1放牧場亦不同，故保留主題、不移植任一牧場座標。"
    - "保留既有 https://commons.wikimedia.org/wiki/File:Miyako_uma.JPG；僅檔名主題無明顯衝突，未重新核驗圖片內容、作者或授權，不代表媒體通過認證。"
    - "座標核對不等於營業、海況、無障礙、媒體授權或實地抵達全面認證；未做現地測量。"
    - "編輯追補 F08：以馬種特徵、農耕用途與保育歷史串成五句導覽，不再重述舊稿錯誤；保留縣指定、來源未明、預約與牛舍禁入限制，non_point與定位欄位不變。"
