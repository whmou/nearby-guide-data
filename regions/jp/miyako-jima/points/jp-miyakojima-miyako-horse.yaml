  title: "宮古馬"
  summary: "沖繩縣指定天然紀念物宮古馬，從約120公分的體高與厚實馬蹄，認識島嶼農耕和保育歷史；參觀須事先聯絡飼養單位。"
  narration: |-
    宮古馬的體高約一百二十公分，頭部相對大，身形卻小巧，腳力強，馬蹄又厚又硬，這些比例是獲准參觀時可以留意的特徵。牠長久以來參與島上的農耕等工作，宮古島市的文化財介紹認為，牠在漫長的生活中逐漸適應沖繩的氣候風土，至於最初從哪裡傳入，仍沒有定論。後來大型馬改良、農業機械化與運輸方式改變，使宮古馬數量減少，也促成保存與繁殖的努力。如今牠是沖繩縣指定天然紀念物，認識這種馬，也是在認識農田裡曾經仰賴動物力量的生活。想實際參觀，可先洽市府位於城邊長間的放牧場，確認預約與開放日；到場後只在指定位置觀察，餵食須經飼養方同意，不進圍欄，更不能把鄰近禁止擅入的牛舍當成入口。
  observationPrompt: "若已獲許可參觀，從指定位置比較宮古馬的頭、身軀與馬蹄比例；不進圍欄，也不自行餵食。"
