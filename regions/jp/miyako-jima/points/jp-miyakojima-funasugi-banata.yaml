  locationHint: "官方觀光頁標示的フナウサギバナタ展望區，不是崖下海岸或舊鳥像入口；由現場公共通道進入可開放平台，留在護欄內，遵守臨時封閉標示。"
  summary: "伊良部島的送船崖：送行、祈安與木材裝船的地方史，比舊照片裡已拆除的鳥像更值得停下來看。"
  narration: |
    如果你帶著舊照片來找一隻張開翅膀的大鳥，先別懷疑自己走錯路：觀光協會說明，這裡原來的鷹形鳥像已經撤除，留下的是展望台與海岸景觀。フナウサギバナタ這個名字，意思是送船的崖。以前人們在這裡為離島出行的人送別、祈求平安，所以眼前的海不只是風景，也是離開家鄉的路。官方還記錄另一種很實際的用途：松木等木材曾從崖上落到海面，再裝船運走。同一段海岸，既承接人的牽掛，也參與島上的搬運工作。現在可以在護欄內，看看高處、海面與水平線之間的關係，想一想沒有公路直達外島時，港口和船如何安排生活。一處看海的展望台，因為送行與勞動的記憶，多出了人的尺度。離開前再回望海面，你看到的也許不再只是漂亮的藍，而是曾經把島與外界接起來的路。
  observationPrompt: "在護欄內比較崖頂與海面的高度關係，想想昔日送船與木材裝船如何利用這段地形；不要尋找已拆除的鳥像。"
