  title: "黑濱御嶽"
  summary: "面向佐和田礁湖的祭祀場所，村落起源傳說之外，也寄託對遠行者的祝福。"
  narration: "面向海的拝所，讓人很自然地把目光放到遠方；黑濱御嶽就在佐和田村落西北側、靠著礁湖的地方，這個方向也和它保存的祭祀習俗有關。官方文化財資料記錄，這裡流傳兄妹神誕生島上居民的村落起源故事，內容屬於神話，不應當作真實人口史；比起追問神話裡每個細節，更值得注意的是居民如何繼續維繫彼此。解說記下「六月願い」儀式之後，還會面向大海，為出門在外的人祈求平安，海因此不只是風景，也是一段等待家人消息的距離。從允許停留的外側觀察拝所與海面的相對位置，看看樹木如何圍出祭祀空間。想到那些人在別處生活、家人仍在島上牽掛的日子，這片海景便多了一層意思：祈願不只為了眼前的人，也為了尚未回來的人。"
  observationPrompt: "從開放外側看，拝所朝向的海面和周圍樹木如何安排？不要進入祭祀核心。"
