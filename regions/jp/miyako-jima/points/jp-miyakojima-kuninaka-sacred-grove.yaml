  title: "國仲御嶽與植物群落"
  summary: "居民祭祀守護的近自然森林；市府明載非祭祀不得入內，僅供背景閱讀，不提供導航。"
  narration: "一片樹林為什麼能在村落旁保留下來？國仲御嶽的答案，和居民長久的信仰有關：宮古島市記錄這裡有福木、琉球黑檀等約六十種植物，長期受到聖域保護，形成接近自然林的樣貌。文化財解說也記下鳥居、約九十公尺的參道，以及石垣廣場與祠旁的獅子像，這些可以幫助理解空間，卻不是遊客入內的許可。市府導覽明載御嶽內部不供一般遊客進入，這一項僅供背景閱讀，不安排走入森林或參加祭祀。把這段故事放回伊良部的生活裡，就能發現有些森林不是因為無人使用才留下，而是對居民太重要，才一直被慎重對待；植物保存和地方信仰，在這裡原本就是同一段故事。"
  observationPrompt: "僅作背景閱讀：想想居民保護祭祀場所，如何同時保存約六十種植物；不前往御嶽內部觀察。"
