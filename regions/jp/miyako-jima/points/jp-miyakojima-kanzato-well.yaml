  title: "神里井（神里ガー）"
  summary: "伊良部村落的老水源，連結聚落形成與至今保留的祭祀記憶。"
  narration: "井口旁的地形，就是讀這個村落故事的起點：生活用水得在地面下尋找，人們也圍著水源建立日常。神里井的官方介紹，把它和伊良部聚落的形成連在一起，並記錄居民曾將它當成重要的共同水源；名稱則被解釋為神明聚集的地方，這是地方信仰中的理解。至於井怎麼被發現，流傳著一頭牛用前腳刨土、讓人找到洞泉的故事，年代被放在1430年前後，但這段應當作口傳來聽，不是考古挖掘確認的事實。文化財解說也記下，這裡的水仍與「出生村落之水」的祭祀觀念相連。站在開放的井外，觀察水源和村落道路的關係，想想以前每天取水的來回；不需要踏進井裡，也能理解一口井為什麼既是生活設施，又是居民珍惜的地方。"
  observationPrompt: "從開放通路看，井口與周圍地面有什麼高低差？不要靠近井緣探身或下井。"
