  title: "宮古島市熱帯植物園"
  summary: "把目光從海轉向樹冠：梯梧與福木並木道、人工栽植的熱帶植物，讓人用散步認識宮古島的綠色景觀。"
  narration: |-
    先抬頭看樹冠，再低頭看步道旁的葉片，這座植物園的樂趣，不一定要從找一朵盛開的花開始。沖繩縣的綠化資料記錄，園內有梯梧和福木並木道，也栽培各式草花；它是一座人工營造的熱帶植物園，不是毫無人為介入的原始叢林。市府介紹的園區約十二萬平方公尺，讓這段散步有機會暫時離開海灘的節奏，換成比較葉形、樹幹與樹蔭的尺度。觀光協會另提到，二〇一一年完成了石原和幸設計的「花之王國」，可以把植物配置當作人們安排生活空間的一種手藝來看。梯梧著名的紅花是春季景色，不要把照片中的花海當作九月底的保證；沒有花時，看看不同樹冠怎麼排列、光線從哪裡落下，也是一種認識園子的方式。只走開放步道，不採葉、不進維護區。
  observationPrompt: "沿開放步道比較梯梧、福木等並木的樹冠與葉形；以現場標牌辨認，不採集植物，也不預期九月一定有紅花。"
