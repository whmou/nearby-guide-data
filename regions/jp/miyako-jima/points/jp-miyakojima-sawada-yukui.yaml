  title: "佐和田ユークイ"
  summary: "供奉大世之主的村落祭場，保存島際移動與農耕技術的地方傳承。"
  narration: "一位傳說中帶來農耕技術的人，如何留在村落的記憶裡？佐和田的答案不是一座華麗紀念館，而是這片居民世代祭祀的地方：佐和田ユークイ供奉的是大世之主，地方傳說把他的來島時間放在1457年，說他從沖永良部島來到伊良部，並在西村、也就是後來的佐和田一帶傳播農耕技術。官方解說又提出，祭場原先可能在白鳥崎，1644年設置烽火制度之後才移到現在的位置；這是根據地方資料作出的推測，並非所有細節都已確定。把眼前的空間和這些島際往來的故事一起看，就能理解村落為什麼用祭祀記住帶來技術的人。從開放外側看看祭場與道路、植被的界線；把遠方島嶼的名字和這片村落放在一起，會發現伊良部的故事，一直都和海上的往來相連。"
  observationPrompt: "站在開放外側，祭場與道路、植被之間有哪些可見的界線？請勿跨越祭祀區。"
