  locationHint: "官方文化資產圖釘指向漲水御嶽所在地及鄰近參拜處，非神聖林地入口；只在開放石板參道與參拜範圍停留，祭祀時禮讓並遵守禁入標示。"
  summary: "從御嶽南側石垣讀宮古的創世傳說與奉納記憶；這裡仍是信仰場所，請在開放參拜範圍安靜觀察。"
  narration: |
    先看御嶽旁一塊接一塊的石頭，別急著往樹林裡走。漲水御嶽和宮古島的起源故事緊緊相連，官方文化資產介紹提到創世與人蛇婚的傳說；這些是島民理解自身來處的故事，不是可以逐句當成史實的年代紀錄。南側石垣則有另一條線索：忠導氏本宗家譜記載，仲宗根豊見親在一五〇〇年赴八重山作戰前許願，戰後以築牆奉納。牆因此保存了信仰，也留下戰爭時代的記憶。但官方特別提醒，別只記住領袖的名字，石垣同樣是許多民眾勞動與石造技術的成果。你可以在允許參拜的外側，看看不規則石塊怎麼彼此配合。把目光從英雄故事移回一雙雙搬石、砌石的手，這道牆就多了一層日常的重量；若有人祭祀，請留出空間，安靜等候。
  observationPrompt: "從開放參拜處觀察南側石垣如何排列不規則石塊；不跨越祭祀界線、不觸碰供物。"
