  kind: "attraction"
  title: "Sumurya巨石墓（外觀）"
  summary: "來間島長間家族的巨石墓，從蓋石與石柱理解宮古的墓葬建築。"
  narration: "先看看頂上那塊大石板，再看看下方如何支撐，就能發現這不是把石頭隨意疊起來的地方。Sumurya巨石墓位在來間聚落南側，是長間家族的墓，官方介紹說，它一直使用到大正時代。整座墓大致呈長方形，東西約九公尺、南北約六點五公尺，頂部的板狀石頭約三點五乘三公尺；石柱上的溝痕，還讓研究者思考上方是否曾有木構造，不過這仍是推測，不能說成確定的原貌。墓內曾發現十四至十五世紀的青瓷碎片，提醒我們這座小島也留下了長遠的物質文化線索。參觀時從公共外側看看蓋石、石柱和整體比例就好，不探入墓室、不踩上石頭，記得這首先是一處家族安息的地方。"
  observationPrompt: "從外側看，大蓋石與支撐石柱之間如何形成墓的輪廓？"
