  title: "舊西中共同製糖場煙囪"
  summary: "留在田野間的製糖煙囪，記錄居民合力建廠與戰爭中斷生產的往事。"
  narration: "田野裡這根獨自站著的煙囪，曾經不是風景，而是一座製糖工場最醒目的工作設備。西中共同製糖場在一九四二年成立，卻只運轉了兩三回，就被日軍強制接收而停工，戰後也沒有重新使用。官方介紹說，原本兩根煙囪如今只留下一根，旁邊還保存鍋爐冷卻用的蓄水槽；這些不太起眼的構造，把甘蔗變成糖的生產過程留了一小段給我們看。到了約一九六〇年，人們曾因受損的煙囪討論拆除，最後選擇留下它，紀念投入建廠的人。請在公共道路邊安全停留，看看磚砌的層次與煙囪和水槽的位置；不要穿過農田，也別貼近受風化的牆體，安靜讀一段被戰爭打斷的日常就好。"
  observationPrompt: "從公共道路可見的角度，磚煙囪與旁邊蓄水槽各保留了哪些形狀？"
