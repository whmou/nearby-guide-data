  title: "宮古神社"
  summary: "宮古神社同祀熊野三神與宮古的豐見親三神；從社殿看跨海信仰與地方歷史如何相遇。"
  narration: "先看看眼前社殿，再讀一讀祭神的名字：宮古神社裡，一邊是從沖繩本島迎來的熊野三神，另一邊是與宮古歷史有關的豐見親三神，這不只是漁民祈求豐收的神社。神社自己介紹的起源，連著一段漂流傳說：據《宮古島舊記》記載，一名赴首里繳納貢物的官員返航遇難，漂到朝鮮，多年後平安回島，為謝神恩而在一五九〇年迎請那霸波上宮的神靈；這是傳承的由來，不宜當成每個細節都已考證的航海紀錄。眼前建築也不能直接算成四百年原物，現今社殿在二〇一〇年落成，承接的是經過遷移與重建的信仰。停在開放參拜區，找找匾額與社名，把建築年代和故事年代分開看，反而更能理解居民如何一代代延續這個地方。\n"
  observationPrompt: "在開放參拜區找找社名、匾額或祭神說明；哪些名字屬於熊野信仰，哪些與宮古歷史有關？不要拍攝私人祈願內容。"
