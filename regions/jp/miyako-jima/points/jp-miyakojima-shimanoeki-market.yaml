  title: "島の駅みやこ（久貝本店）"
  summary: "從宮古麵條、島豆腐到地方點心，在同一間市場讀懂日常餐桌。"
  narration: "餐廳端上一碗宮古麵之前，食材在島上長什麼樣子？到島の駅みやこ，答案就在貨架和冷藏櫃裡：店家介紹，這裡販售島內製麵所的宮古麵條，也有搭配用的滷肉、魚板與島豆腐；把原料和你吃過的那碗麵連起來，逛市場就多了一點尋寶的樂趣。再轉向點心區，傳統的さたぱんぴん，和加入紅芋、黑糖等地方食材的甜點放在同一個生活脈絡裡，既是伴手禮，也可能是居民平常買回家的小點心。這裡是久貝本店，不是機場裡的分店，官網也分別列出兩者。可以挑一樣不熟悉的食材，讀讀包裝上的產地、製造者和吃法；即使只帶走一小袋東西，也會比只記住「宮古很好吃」，多認識一點島上的餐桌。"
  observationPrompt: "找一項吃過但沒看過原料的宮古食物，讀包裝上的製造者、產地與吃法。"
