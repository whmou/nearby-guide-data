  locationHint: "保良泉ビーチパーク遊客區具名圖釘，地址城辺保良1139-1，代表天然湧水泳池與海岸旁設施，不是泉眼、洞穴或停車場座標。泳池採營業管理，出發前查復業／臨時公告及付費規定；業者停車場僅供泳池使用者。"
  summary: "保良泉（ボラガー）的天然湧水被引入人工淡水泳池；定位採海灘公園遊客區，與海上洞穴行程分開。"
  narration: |
    在保良泉，可以先找一個很有意思的對照：一邊是海，另一邊卻是利用天然湧水的人工淡水泳池。它不是把海水圈起來，也不是走進鍾乳洞就會遇到的地下湖。市府與觀光協會都把這裡介紹為湧水泳池旁的海岸，讓泉水成為人可以使用的遊憩空間。保良泉的在地名稱寫作ボラガー；讀懂名字之後，更重要的是分清場所。地圖上的保良泉海灘公園，是泳池與海岸附近的遊客區，不是泉眼、洞口，也不是每一家海上行程固定報到的地方。現任業者由二〇二五年開始營運，官網亦曾刊登停業後預定復業的公告，所以不要只看舊遊記就直接抵達。出發前確認泳池是否開放、是否需要付費，以及可使用哪個停車場；到了現場，從允許停留處觀察人工池邊與自然海岸的差別，就能看見同一股水如何接上島上的日常休閒。
  observationPrompt: "在開放遊客區比較人工泳池與前方海岸的邊界；核對當天營運及停車限制，不把海灘公園當洞穴入口。"
