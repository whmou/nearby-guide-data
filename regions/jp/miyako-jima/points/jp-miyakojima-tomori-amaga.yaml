  title: "友利阿瑪井（地面外觀）"
  summary: "在地面認識曾供養友利一帶居民的深洞泉，理解自來水普及前的取水勞動。"
  narration: "如果從現場允許停留的地面位置看得到井口或石階，先想想：以前的一桶水，得走多遠才能帶回家？友利阿瑪井位在友利與砂川交界，官方記載井口到湧水處約有二十公尺深，一桶水裝滿以後，回家的上坡才真正開始。在一九六五年城邊自來水普及以前，這口井是重要的生活水源，取水多由婦女和孩子負責；文化財資料還記錄石階旁岩面留下長年摩擦的痕跡，讓日復一日的勞動有了具體形狀。今天轉一下水龍頭就完成的事，當年需要不少力氣。請只從允許停留的地面觀察，看不到井口、階梯或磨痕也不必往下找，若現場有解說牌可對照閱讀；這趟停留要理解的是生活，不是挑戰井的深度。"
  observationPrompt: "若從允許停留的地面看得到井口或石階，留意取水路線的高低；看不到就閱讀官方介紹，不下井尋找。"
