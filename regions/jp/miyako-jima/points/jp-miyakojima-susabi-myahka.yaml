  kind: "attraction"
  title: "スサビミャーカ巨石墓"
  summary: "伊良部村落東側的雙重石垣巨石墓，從石板接合看早期石工技術。"
  narration: "大塊石材和比較整齊的石板，在這座墓裡各有不同的工作：宮古島市的解說將スサビミャーカ推定為約1600年建造，外圍石垣東西約十點八公尺、南北約七點二公尺，與內側石造形成兩重圍合的墓葬空間。官方調查還記下，石棺的四壁、底板和蓋板各用整片石板，底石接縫留有排水空隙，構造比遠看時更講究。至於墓主人是誰、為什麼建在這裡，宮古島市博物館的教材仍把它們列為待解的問題。內部細節可以透過解說理解；若從開放外側看得到，就比較石塊尺度與排列，不必走入墓室。這些沉默的石頭，既留下施工的線索，也保留了我們還不知道的部分。"
  observationPrompt: "若開放外側能看見石垣，留意石塊尺度和排列；內側石棺、排水空隙以官方記錄理解，不為取得視野越界。"
