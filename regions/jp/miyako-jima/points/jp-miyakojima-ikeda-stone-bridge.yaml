  title: "池田矼石拱橋"
  summary: "國道旁的琉球石灰岩古橋，以拱形石組留下下地舊道路的交通記憶。"
  narration: "把目光從旁邊的現代道路移開，這座不大的石橋，曾是下地往來交通的一部分。池田矼靠近崎田川河口，以琉球石灰岩堆成拱形；橋上的「矼」字看來陌生，在這裡說的就是石橋。官方引述一七二七年的《雍正舊記》，已經記下池田矼的長、寬與高度，而一八一七年又有和下地矼道一起大修的紀錄。所以眼前不是一個固定不變的古物，而是一代代人修補、維持通行的成果。舊路串連平良、川滿、洲鎌等聚落，走橋的人帶著什麼貨物、要去見誰，我們不能替他們編答案，但可以看懂石匠留下的方法。請從公共可站立處觀察拱頂石塊如何排列，不下河道、不站上車道，也不要攀附古橋。"
  observationPrompt: "石塊在拱頂與兩側的排列方向有什麼不同？"
