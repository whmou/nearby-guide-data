  kind: "attraction"
  title: "比嘉Road Park海岸展望休憩處"
  summary: "在東岸道路的高處停下，從涼亭與公共展望空間欣賞海岸和遠方島影。"
  narration: "海岸公路一路轉彎，到了這裡，先把車停好，再讓眼睛去旅行。比嘉Road Park是一處設有停車空間、涼亭和廁所的道路休憩點，觀光協會把它介紹為外周道路上的高處展望站，海岸不必走到水邊，也能看出開闊的尺度。資料還提到，朝左側遠方可以眺望大神島；是否能分辨島影，要看當天能見度，不必為了找它翻過護欄。這種小型休憩設施的價值，正是讓趕路的人有一個可以安心停下來的位置。先看近處地形，再把視線送向海平線，試試不同距離的輪廓怎麼重疊。附近雖有牧場，卻不是都對外開放，請留在公園公共範圍，不走進農地或牛舍，也不要站到車道上取景。"
  observationPrompt: "從公共展望空間比較近岸地形、海平線與遠方島影；天候不佳時能辨認哪些層次？"
