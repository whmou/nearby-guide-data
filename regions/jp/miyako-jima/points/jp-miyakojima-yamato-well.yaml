  title: "大和井（ヤマトガー）"
  summary: "沿著圓形石壁認識宮古的取水生活，也分清文獻年代與官員專用的地方傳說。"
  narration: "看這口井，先別急著找水面，周圍一圈圈堆起的石壁，其實更值得慢慢看：大小切石沿著圓弧排列，石階把地面和泉水連起來，取一桶水也需要一段上下坡的路。宮古島市的文化財解說根據1727年的《雍正舊記》，推測大和井約在1720年前後開鑿；這是文獻推定的年代，不是井上刻著確切開工日。另一層故事來自地方傳承，說這裡曾供王府派來的官員等少數人使用，沿途有兩道門，也有人看守水源，但這些細節要當作傳承來聽。站在安全的步道上，留意石壁轉彎處怎麼接合、階梯又如何順著地形下降：原本只是生活必需的水，在這裡同時留下石匠手藝，以及誰能使用水源的歷史問題。"
  observationPrompt: "圓形石壁和石階在哪裡相接？從安全開放處找找切石大小與排列的變化。"
