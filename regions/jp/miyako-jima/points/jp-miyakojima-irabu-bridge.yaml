  title: "伊良部大橋"
  summary: "2015年通車、全長3,540公尺的跨海橋梁；從宮古島側陸上橋頭理解兩島連接的尺度，橋上不可停車賞景。"
  narration: |
    先在陸側安全的位置，順著一根根橋墩看向海面：這條伸向伊良部島的道路，長達三千五百四十公尺，遠端並不是另一段海岸公路，而是另一座島。伊良部大橋在二○一五年一月開通，觀光協會將它介紹為日本最長的免費通行橋梁；對旅人來說是一段風景，對兩島的日常往來，則是一條真正把海峽接起來的路。別急著把整座橋塞進照片，先比較近處的橋墩和遠處逐漸縮小的線條，就能感受到它的長度。再看看橋旁海面的深淺色塊，今天的光線把哪些部分照亮了？這裡的定位是宮古島側橋頭，不是橋中央，也不是停車場；請在可合法停留的陸側觀看，駕駛過橋時專心看路，不要為了照片臨停。
  observationPrompt: "在陸側合法停留處，能否看出橋墩向遠方逐漸縮小？橋旁海色有哪些深淺變化？"
