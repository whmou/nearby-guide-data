  kind: attraction
  title: "伊良部大橋"
  summary: "全長3,540公尺，2015年完工，是日本最長的免費通行橋梁，連接宮古島與伊良部島，橋面最高點約為海面上27公尺，兩側海景壯闊。"
  narration: |
    伊良部大橋於2015年1月完工通車，以三千五百四十公尺的全長連接宮古島與伊良部島。晴天時，橋兩側能看見層次豐富的藍綠海色。以往兩島居民往返依靠渡輪，橋梁通車也改變了日常交通。想慢慢看橋與海，請在陸側合法可停留的觀景位置欣賞；橋上沒有供遊客任意停車拍照的觀景停車灣，駕駛應專心行車，遵守現場標誌。
  observationPrompt: "在陸側合法觀景位置看向橋梁：海色有哪些深淺變化？不要在橋上停車、下車或為拍照跨越護欄。"
