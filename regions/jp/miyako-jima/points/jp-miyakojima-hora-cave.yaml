  summary: "保良一帶的海上洞穴體驗受潮汐、天候與保全規範限制；尚未取得此舊名稱的固定安全抵達點，不提供自行探洞導航。"
  narration: |
    保良一帶的洞穴體驗，首先要面對的是海與潮汐：泳池業者介紹的南瓜洞行程，需要從海上搭獨木舟前往，出發時間跟著潮汐調整，風浪或天候不合適就可能取消，不是買了票便能沿步道自行走入的展示洞。宮古島市推薦選擇參與保良クバクンダイ保全協定的業者，讓旅遊也顧及洞穴環境，鐘乳石只能看、不觸摸。「保良泉鍾乳洞」這個名稱尚未核實有獨立對應的公開入口或固定集合點，不能拿附近的海灘當成入洞處。若想預約相關海上導覽，請先由承辦業者確認集合點、潮汐、裝備與取消條件；等待合適條件也是旅程的一部分，別為了找洞而自行涉水。
  observationPrompt: "只在已預約、業者允許的導覽範圍觀察鐘乳石；事前確認集合點、潮汐與取消條件，不自行從海灘涉水找洞。"
