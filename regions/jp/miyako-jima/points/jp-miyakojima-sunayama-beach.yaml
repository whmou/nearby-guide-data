  kind: attraction
  title: "砂山ビーチ（砂山海灘）"
  summary: "以巨大天然拱形岩石聞名的秘境海灘，白色珊瑚沙灣與碧藍海水相映，拱岩本身是宮古島最具辨識度的自然地標之一；請從開放的海灘範圍欣賞，不要穿越岩拱。"
  narration: |
    砂山海灘得名於入口處那座高聳的沙丘，停好車後沿階梯翻越一座沙丘，便可俯瞰整個海灣。海灘中央矗立著一塊天然形成的拱形岩石，珊瑚岩被海浪侵蝕成圓弧形，陽光從拱洞打進來，形成只有在特定角度才能拍到的絕美構圖。拱岩兩側的海水格外清澈，珊瑚礁碎石讓海底紋理清晰可見。觀賞與散步都應遵守現場開放範圍及警示，不進入岩拱下方或跨越圍欄；海況不佳時不要接近水邊。
  observationPrompt: "從允許停留的海灘範圍遠觀天然岩拱，留意光線如何改變岩石與海面的色彩；不要為了取景穿越岩拱、跨越圍欄或進入封閉區。"
