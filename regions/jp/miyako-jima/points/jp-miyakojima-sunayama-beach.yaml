  title: "砂山ビーチ（砂山海灘）"
  summary: "越過白沙丘才展開的小海灣，左側琉球石灰岩拱岩是辨識重點；從開放沙灘遠觀，不進入岩拱下方。"
  narration: |-
    砂山的第一個看點，其實是那座得用雙腳越過的白沙丘：海不是一路攤在眼前，而是在坡頂之後才打開。面向海時，左手邊那塊中央掏空的大岩，讓小小的海灣有了容易記住的輪廓；宮古島觀光協會把它介紹為隆起珊瑚礁形成的洞穴，日本交通公社則明確指出它是琉球石灰岩。漂亮的拱形也提醒人，岩石仍會風化、落下，因此拱岩區因落石與崩落風險受到管制，不能把穿過洞口當成拍照路線。不妨從允許停留的沙灘，比較岩石外緣、洞口和海面的形狀，看看一個空洞怎麼改變整片海岸的構圖。回程還要再上沙丘，請替腳力留點餘裕；海上有突然變深的地方，這一站以岸上觀景為主，海色再透也不是安全下水的保證。
  observationPrompt: "在圍欄外的開放沙灘，辨認面海左側拱岩的外緣與洞口；不要穿越岩拱，也不跨欄取景。"
