  title: "下地島帶岩（帯岩）"
  summary: "腰部收窄的巨岩，同時承載大浪傳承與祈求漁獲、家人平安的信仰。"
  narration: "這塊巨岩也有「腰身」：中段向內收，彷彿繫了一條腰帶，宮古島市的《綾道》導覽因此解釋了「帶岩」這個名字。文化財專頁記錄它高約十二點五公尺，重量估計約兩萬噸；從安全的陸側和自己的身量相比，就能理解它為什麼會成為醒目的地方地標。至於巨岩從哪裡來，官方舊解說保留了它被1771年明和大海嘯推上岸的說法，但這是傳述，不能直接當成確定的地質定年。另一個被記錄的面向，是居民把它作為信仰的神體，祈求漁獲豐收和家人平安。沿開放通路換個角度看看腰帶般的輪廓，岩石巨大的尺度，和居民日常平安的小小願望，在這一站恰好放在一起。"
  observationPrompt: "從安全陸側看，岩石哪個高度最像束著腰帶？不要攀爬或站到突出岩體下。"
  countryCode: "JP"
