  title: "来間島サトウキビ畑"
  summary: "来間島農業景觀主題，非具名觀光農場；從公共道路旁辨認耕作景觀，理解甘蔗作為宮古農業生產的一部分。"
  narration: |
    如果在来間島的公共道路旁看見成排甘蔗，先看看田地和道路的界線，不必走進去，整齊的栽植方向就能讓風景多一層意思。沖繩官方離島旅遊文章記錄，過橋後往島內行駛，沿途會經過甘蔗田；這不是為旅客布置的背景，而是正在生產的土地。縣政府二○二六年的宮古農業工作說明，把甘蔗列為重要的生產振興項目，也提到需要改善單位面積產量、培育新一代農業工作者。於是眼前一片綠色，不只有作物本身，還連著收成、技術和接手耕作的人。可以留意不同田塊的高低和種植排列，但不能只憑外觀判斷今天是否能收割。請在合法、安全的位置停留，讓農機先行；不踩田埂、不折甘蔗，也別把農田入口當成臨時停車格。
  observationPrompt: "從公共道路上的安全位置看，田塊栽植方向是否一致？哪裡是田地邊界、哪裡是農機出入口？不要進田觀察。"
