  title: "英吉雅海濱公園（インギャーマリンガーデン）"
  summary: "沿天然海灣的公共步道看海，從海岸形狀認識淡水與海水相遇的環境。"
  narration: "先別急著把它當成另一片沙灘，看看陸地怎麼把水面抱成一個小海灣。英吉雅海濱公園利用天然入江整備了步道與廣場，觀光協會也介紹陸上的散策路線和高處休憩所；不下水，一樣可以讀懂這片海岸。這裡還藏著一個小線索：協會說，淡水與海水混合時，水中有時會出現晃動般的視覺現象，那是兩種水性質不同造成的，不是每次來都能看見。你可以沿開放步道，依序比較灣內、灣口和外海的形狀，想想為什麼同一片海會有這麼多面貌。灣內看來平靜，也不代表灣口沒有潮流；今天的導覽以岸上散步為主，不從橋上跳水、不越過護欄，遇到風浪或封閉告示就折返。"
  observationPrompt: "沿開放步道比較灣內、灣口與外海的輪廓，哪一段受到陸地包圍最多？"
