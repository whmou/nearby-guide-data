  title: "佐良浜漁港"
  summary: "佐良浜港從島際渡船門戶轉為漁業與交流空間；日返一本釣鰹魚，讓港邊景色連上漁村的工作日常。"
  narration: "先看岸邊的船與港區設施，再望向後方聚落，佐良浜的風景不是單純排好給遊客拍照的背景，而是一個仍在運作的港。宮古島觀光協會介紹，伊良部島佐良浜以當天出海、當天回港的一本釣鰹魚聞名；「一本釣」說的是漁法，不能把每艘船的漁獲或返港時間都當成固定節目。這裡也曾停靠連結宮古島與伊良部島的定期船，水產廳資料記載，二〇一五年一月伊良部大橋開通後，這條渡船服務停止，港口的角色跟著改變，之後整備了結合處理漁獲、加工、食堂、直售與體驗的設施。散步時試著分辨遊客可走的空間與工作區，不擋卸貨通道，也不要為了找角度登上船。從交通門戶到把漁業介紹給外地人的地方，港邊建築的用途，其實比一張海景照片更能說明島上的變化。\n"
  observationPrompt: "從公共通行處辨認停船、卸貨與遊客可用設施的界線；看看有哪些不同用途的港區標示，勿進入作業區。"
