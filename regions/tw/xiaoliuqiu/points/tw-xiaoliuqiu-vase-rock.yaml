    coordinateEvidence: https://www.dbnsa.gov.tw/zh-tw/Experience/articles?a=347 將花瓶岩及遊客中心列為相鄰但不同的遊程停留點，並描述遊客中心戶外平台；未提供可確定為花瓶岩岸上觀看點的單獨經緯度，因此未挪用整棟遊客中心或其附近公車站座標。
