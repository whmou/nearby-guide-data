  reason: 2026-09-16 整合複核。管理處以花瓶岩之名公布明確經緯度及數字地圖q，足以認證為實體landmark，供80至150公尺級鄰近語音觸發使用；不宣稱pin是入口或安全路線。原22.3682,120.3768及白燈塔下方提示錯誤。依整合要求撤銷先前因缺獨立岸上入口而給予的unresolved判定，直接採官方地標pin，未虛構步道座標。官方並建議保持距離遠觀。
  sources:
  - url: https://www.dbnsa.gov.tw/zh-tw/attraction/AttractionPage?a=222
    title: 大鵬灣國家風景區管理處－花瓶岩
    coordinateEvidence: 直接HTTP讀取 https://www.dbnsa.gov.tw/zh-tw/attraction/AttractionPage?a=222，旅遊資訊顯示經度120.38076、緯度22.35566；iframe及一鍵導航均為 https://maps.google.com/maps?q=22.35566,120.38076 。直接抽取數字q並核對頁面名稱花瓶岩，採緯度22.35566、經度120.38076作landmark；不是@視窗中心，也不把岩體pin稱為岸上入口。
  - url: https://deh.csie.ncku.edu.tw/poi_detail/8045
    title: 國立成功大學文史脈流－小琉球花瓶岩
    coordinateEvidence: https://deh.csie.ncku.edu.tw/poi_detail/8045 另列緯度22.355418、經度120.381005，參考來源註為實際體驗，支持同一花瓶岩景觀的位置。此點未標明入口且地址帶問號，故不採其點作岸上觀景點；主座標採官方數字pin，不平均兩來源。
  - url: https://www.dbnsa.gov.tw/zh-tw/Experience/articles?a=347
