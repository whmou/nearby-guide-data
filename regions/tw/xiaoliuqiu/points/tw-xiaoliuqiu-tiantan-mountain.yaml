  reason: 2026-09-16 查核。YAML 把天台山描述為小琉球87公尺最高峰，且從碧雲寺後方石階登頂；查得官方資料僅支持東南台地最高87公尺，登山紀錄稱龜仔路山／八七高地，不能證明與此名稱、路線為同一景點。觀光署開放資料中的天台山則位在澎湖望安。身分疑似混淆，原22.3493,120.3738及步道敘述未獲支持；不擅改地名或移用別山座標。
