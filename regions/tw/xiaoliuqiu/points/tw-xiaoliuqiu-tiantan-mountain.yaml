  title: "天台山"
  summary: "原文地點待核實：尚未證實小琉球「天台山」的名稱與碧雲寺後方登頂路線。不可依本筆找山路，也不自動替換成八七高地、龜仔路山或澎湖望安天台山。"
  narration: |
    原文地點待核實。原稿把天台山稱為小琉球87公尺最高點，並描述由碧雲寺後方石階登頂；本次資料不足以建立名稱、山頭與路線三者的關係。
    
    官方資料介紹小琉球東南台地最高約87公尺，但高度相同不能證明它就是原稿的天台山。觀光署另有澎湖望安天台山資料，更不能移用到小琉球。
    
    因此暫不提供入口、步行時間、全島展望或免費登山承諾。請先取得主管機關或現地可靠資料，未核實前不要擅入寺後山坡、私人土地或無標示小徑。
  observationPrompt: "地名與公共路線尚未確認，請勿依本筆登山；先查核正式地名及管理單位資料。"
