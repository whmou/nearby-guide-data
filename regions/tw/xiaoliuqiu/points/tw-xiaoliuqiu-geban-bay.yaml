  reason: 2026-09-16 查核。官方座標及導航明確對應西側蛤板灣白色貝殼沙灘，具停車場及岸上散步賞景用途。原座標偏離約2293公尺，東南側定位錯誤。原文鼓勵浮潛、退潮入水與海龜近距離體驗，與管理處『請勿下水游泳』警示矛盾，必須另修；官方亦公告季節性夜間管制。此處核准的是岸側 area 錨點，非一個推算的海灣中心。
  sources:
  - url: https://www.dbnsa.gov.tw/zh-TW/attraction/AttractionPage?a=231
    title: 交通部觀光署大鵬灣國家風景區管理處：蛤板灣沙灘
    coordinateEvidence: https://www.dbnsa.gov.tw/zh-TW/attraction/AttractionPage?a=231 的唯讀 HTML 明列『經度：120.36022 緯度：22.33456』，一鍵導航 href 為 https://maps.google.com/maps?q=22.33456,120.36022。頁面确认西部沙灘、停車場及賞景用途，並警告勿游泳和5月至10月夜間管制；未從海灣外形或地圖中心估計座標。
  - url: https://liuchiu-intertidal.pthg.gov.tw/
    title: 屏東縣潮琉生態保育網：蛤板灣開放與導覽須知
    coordinateEvidence: https://liuchiu-intertidal.pthg.gov.tw/ 將蛤板灣列為受管理的潮間帶遊憩區，查核日已有2026-08-27恢復開放公告並列導覽要求；未抽取新的數值座標，只用於獨立管理機關的可進入條件核對。
