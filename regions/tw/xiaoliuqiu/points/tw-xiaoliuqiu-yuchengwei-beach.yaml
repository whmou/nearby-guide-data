  reason: 2026-09-16 補查。『小琉球漁埕尾沙灘』Google 查詢僅回傳視窗，已拒用；改以官方確有的同岸段名稱『漁埕尾潮間帶』取得唯一具名 feature，地址為漁福村環島公路34號。縣府資料明述該訪客區包括沙灘、岸際平台、管制站及規劃步道，故採同名岸側 visitor_area，不宣稱已取得沙灘個別 feature、入口或集合亭的精測座標。原東南角及22.336,120.39錯誤；此處在東北側，北接中澳沙灘。主流程須保留錨點名稱及受管制接近的限定。
