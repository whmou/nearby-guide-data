  reason: 2026-09-16 查核。YAML 同時指杉福及花瓶石，未指定業者，且體驗發生於水中，不具唯一陸上錨點。官方調查將花瓶岩、美人洞及杉福近岸列為不同浮潛區，無法支持原 22.338,120.368 是共通報到點。不借用杉福漁港或已核實的生態廊道入口。安全交接：tw-xiaoliuqiu-sea-turtle-snorkel.yaml第13行原句『就在你面鏡前三十公分外』及第66行ratingEvidence.distinctiveness.note『即可與野生綠蠵龜零距離共游』鼓勵或美化過度靠近；建議主流程最小範圍刪除這些近距離承諾，改為『與海龜保持至少五公尺距離，不觸碰、不追逐、不包圍、不干擾。』依據縣府潮琉生態保育網公開注意事項，並非本報告另行主張法定距離。本次沒有修改YAML。
