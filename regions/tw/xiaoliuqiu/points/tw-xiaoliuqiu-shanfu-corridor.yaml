  reason: 2026-09-16 查核。採官方明確標名的杉福砲陣地入口，不採琉行之道一般景點中心。另一份官方工程資料明確把此砲台定位於杉福生態廊道，建立兩名稱的同址關係。原 22.3625,120.3615 過度偏北；YAML 將陸上舊軍事廊道與潮間帶賞龜體驗混合，核實範圍限於陸上入口，不背書夜間龜群上岸等敘事。
  sources:
  - url: https://www.dbnsa.gov.tw/zh-tw/attraction/AttractionPage?a=262
    title: 大鵬灣國家風景區管理處－琉行之道（杉福砲陣地入口）
    coordinateEvidence: '直接HTTP讀取 https://www.dbnsa.gov.tw/zh-tw/attraction/AttractionPage?a=262，正文明列『杉福砲陣地入口: 22°20''37.7"N 120°21''44.6"E』並連結 https://maps.app.goo.gl/sxyvSujiBMxkW7NT9?g_st=il 。以度+分/60+秒/3600換算為22.3438056,120.3623889；沒有使用網址@視窗中心，也未使用同頁一般景點座標22.34417,120.36219。'
  - url: https://admin.taiwan.net.tw/fapi/AttFile?id=34405&type=NewsAttFile
    title: 大鵬灣管理處－琉行之道景點設施修繕工程杉福砲台環境現勘資料
    coordinateEvidence: https://admin.taiwan.net.tw/fapi/AttFile?id=34405&type=NewsAttFile 印刷頁16文字將杉福砲台列為琉行之道起點，並明指位於小琉球西側杉福生態廊道、由舊軍事基地改建。此來源用於入口身分與陸上步道用途核對，沒有另行抽取或推估座標。
  - url: https://nanai.tw/liuqiu-old-cannon/
    title: Nana愛旅行札記－舊砲陣地（杉福生態廊道）
    coordinateEvidence: https://nanai.tw/liuqiu-old-cannon/ 的實地遊記將旧砲陣地與杉福生態廊道連結，說明入口原為軍事砲陣地、位於肚仔坪與杉福漁港之間；獨立核對同址及參觀動線。報告座標只取前述官方明列入口DMS，不取遊記照片或地图視窗。
