  title: "小琉球海鮮美食"
  summary: "小琉球海鮮飲食是遍布不同餐館的體驗主題，不是固定廣場或市場。菜色、漁獲來源與價格依實際店家確認，不以未具名攤販作導航目的地。"
  narration: |
    小琉球的飲食文化與海洋生活相連，官方美食介紹也列有蜂巢蝦、魷魚小封等料理。選一家實際營業的餐館，了解食材與做法，比把全島飲食縮成一個未核實路口更貼近真實體驗。
    
    本筆沒有指定餐廳或市場，也沒有統一的集合廣場。用餐前請查實際店名、地址、價格與食材來源；不要在保育區自行採集海膽、貝類或其他生物。
  observationPrompt: "在自行選定的合法營業餐館閱讀菜單，詢問食材來源、時價與料理方式；不要依本筆尋找未具名海鮮攤或自行採集食材。"
