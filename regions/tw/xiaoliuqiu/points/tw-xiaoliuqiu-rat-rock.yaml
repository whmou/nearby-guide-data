  reason: 2026-09-16 整合複核。林業署確認老鼠石位於東南厚石奇岩帶；本次另找到單獨Rat Rock Google place連結，從!3d/!4d抽取22.3230315,120.3622755，而非@視窗中心。另一篇獨立遊記的具名短連結解析到同一place ID並標示老鼠岩、忠孝路72號，支持個別地標身分。故按整合要求改為verified landmark，非安全到達入口，亦未借用觀音石或整組奇岩登錄點。原22.3644,120.3626偏北約4.6公里；YAML北端、花瓶石步行三至五分鐘的說法應移除。
  sources:
