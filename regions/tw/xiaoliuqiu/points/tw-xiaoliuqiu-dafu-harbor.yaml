  reason: 2026-09-16 查核。管理處以此座標作為大寮（大福）漁港的訪客導航目的地，並列有停車場；台灣好行另有同名景點與路線停靠，核對為可從陸上抵達的東側港區。原座標偏離約1481公尺，原文『西側主漁港』與官方東側位置矛盾。採港區 area 錨點，不把一般港區定位冒稱特定渡輪登船閘口；原文清晨魚市、百年歷史與航班敘述未通過本次座標查核。
  sources:
  - url: https://www.dbnsa.gov.tw/zh-TW/attraction/AttractionPage?a=251
    title: 交通部觀光署大鵬灣國家風景區管理處：大寮（大福）漁港
    coordinateEvidence: https://www.dbnsa.gov.tw/zh-TW/attraction/AttractionPage?a=251 的唯讀 HTML 明列『經度：120.37396 緯度：22.33444』，其一鍵導航 href 為 https://maps.google.com/maps?q=22.33444,120.37396。頁面明述大福村東面海岸、別名大寮漁港及停車場；使用該港區訪客導航點，不使用海上船位或地圖 @ 中心。
  - url: https://www.taiwantrip.com.tw/Frontend/Attractions/TripSpecialp/S12072
    title: 台灣好行旅遊服務網：大福漁港
    coordinateEvidence: https://www.taiwantrip.com.tw/Frontend/Attractions/TripSpecialp/S12072 確認大福／大寮為同一東岸漁港，亦是601小琉球線列出的旅遊景點。HTML 導航僅為 https://www.google.com.tw/maps/dir//大福漁港，未提供數值座標，因此只用於身分及陸上交通核對，不從名稱搜尋結果推定新座標。
