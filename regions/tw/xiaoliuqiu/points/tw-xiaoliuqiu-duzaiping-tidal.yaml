  locationHint: 小琉球西北側肚仔坪；依環島公路往海景休閒渡假區方向的岔路下行約50公尺，先抵達岸側入口區。座標為官方景點導航錨點，非外海潛點；進潮間帶須依預約、導覽與現場管制，不得照原文自行踏入。
