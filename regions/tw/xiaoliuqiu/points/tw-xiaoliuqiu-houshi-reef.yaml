  reason: 2026-09-16 查核。管理處有明列座標、一鍵導航及停車場，並描述沿公路可觀看的礁岩；其遊憩承載評估另列此區岸側觀賞活動。原座標偏離約1817公尺。厚石裙礁是延展海岸地貌，採 area 而不宣稱唯一入口；原文『厚石漁港旁』及鼓勵走礁盤、浮潛的描述未獲此陸上導航證據支持，不應沿用。
