  reason: 2026-09-16 查核。觀光管理處的數值 pin 與航港局燈塔位置相符，航港局並確認可參觀及外部屬開放空間。原座標偏離約4471公尺，是本組最大誤差；原『最北端』應為東南方山頂。地標本體與戶外參觀區緊鄰，採 landmark 並明確限制於外部，不將內部登塔當成可用抵達活動。
  sources:
  - url: https://www.dbnsa.gov.tw/zh-TW/attraction/AttractionPage?a=248
    title: 交通部觀光署大鵬灣國家風景區管理處：白燈塔
    coordinateEvidence: https://www.dbnsa.gov.tw/zh-TW/attraction/AttractionPage?a=248 的唯讀 HTML 明列『經度：120.36651 緯度：22.32886』，導航 href 為 https://maps.google.com/maps?q=22.32886,120.36651；文字明示東南方、厚石裙礁西側山頂及停車場。不是地圖 @ 中心。
  - url: https://www.motcmpb.gov.tw/
    title: 交通部航港局：琉球嶼燈塔資訊卡
    coordinateEvidence: https://www.motcmpb.gov.tw/ 的琉球嶼燈塔卡明列『北緯 22° 19.729′ 東經 120° 21′.991』及『是否開放參觀：是』。按度與十進位分換算為22.3288166667、120.3665166667，與採用的官方觀光 pin 約5公尺相符；此為燈塔本體位置的獨立主管機關核對，不冒稱入口測量。
