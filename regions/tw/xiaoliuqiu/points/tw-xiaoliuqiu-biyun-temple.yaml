  anchorType: landmark
  checkedAt: '2026-09-16'
  reason: 2026-09-16 查核。官方景點座標、導航與和平路61號一致，文化部建檔資料另確認同址碧雲寺。原座標偏離約857公尺。重大身分敘事錯誤：實際主祀觀音菩薩，不是原文的三山國王廟；大福村也不是原提示中的本福村。僅寺廟地點通過查核，三山國王、潮州移民與聖誕描述均須另行人工修正。
  sources:
  - url: https://www.dbnsa.gov.tw/zh-TW/attraction/AttractionPage?a=249
    title: 交通部觀光署大鵬灣國家風景區管理處：碧雲寺
    coordinateEvidence: https://www.dbnsa.gov.tw/zh-TW/attraction/AttractionPage?a=249 的唯讀 HTML 明列『經度：120.36992 緯度：22.33814』，導航 href 為 https://maps.google.com/maps?q=22.33814,120.36992。頁面地址為大福村和平路61號，主祀觀音菩薩，列有參訪時間與停車場；採寺廟地標，沒有把該數值重新描述成精確門口。
  - url: https://tcmb.culture.tw/zh-tw/detail?id=505781&indexCode=Culture_Place
    title: 國家文化記憶庫：東港公學校琉球嶼分教場
    coordinateEvidence: https://tcmb.culture.tw/zh-tw/detail?id=505781&indexCode=Culture_Place 記錄昔日分教場租用觀音堂廟地，並明確對應今日大福村和平路61號碧雲寺。此來源只用於獨立核對名稱、觀音堂身分與地址；未從它提取入口座標。
